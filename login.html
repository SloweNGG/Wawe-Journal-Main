<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Wawe Journal</title>
  <link rel="icon" type="image/svg+xml" href="resim.svg">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">
      <div class="logo-icon">
        <svg width="16" height="16" viewBox="0 0 22 22" fill="none">
          <polyline points="2,16 7,9 12,13 19,4" stroke="#7c6dfa" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </a>
  </nav>

  <div class="auth-wrap">
    <div class="auth-box">
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-sub">Don't have an account? <a href="register.html" style="color:var(--accent);">Sign up</a></p>

      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="trader@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password" />
      </div>

      <p class="error-msg" id="err" style="display:none;"></p>

      <button class="btn btn-primary" id="login-btn" style="width:100%;justify-content:center;margin-top:.5rem;">
        Login
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
  <script>
    function hasTurkishChars(str) {
      return /[ığüşöçİĞÜŞÖÇ]/.test(str);
    }

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = 'dashboard.html';
    })();

    document.getElementById('login-btn').addEventListener('click', async () => {
      let email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errEl    = document.getElementById('err');
      errEl.style.display = 'none';

      email = email.toLowerCase();

      if (!email || !password) {
        errEl.textContent = 'Email and password are required.';
        errEl.style.display = 'block'; return;
      }

      if (hasTurkishChars(email)) {
        errEl.textContent = 'Email address cannot contain Turkish characters. Example: trader@example.com';
        errEl.style.display = 'block'; return;
      }

      if (!isValidEmail(email)) {
        errEl.textContent = 'Please enter a valid email address.';
        errEl.style.display = 'block'; return;
      }

      const btn = document.getElementById('login-btn');
      btn.disabled = true; btn.textContent = 'Logging in…';

      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      
      if (error) {
        errEl.textContent = 'Invalid email or password.';
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Login';
        return;
      }
      
      const { data: profile, error: profileError } = await sb
        .from('user_profiles')
        .select('is_active')
        .eq('id', data.user.id)
        .single();
      
      if (profileError || !profile || profile.is_active === false) {
        await sb.auth.signOut();
        errEl.textContent = '❌ Your account has been deactivated. You cannot log in. Please contact support.';
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Login';
        return;
      }
      
      window.location.href = 'dashboard.html';
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    });
  </script>
</body>
</html>
