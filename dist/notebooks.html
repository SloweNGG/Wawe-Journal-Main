<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Defterler – Wawe Journal</title>
  <link rel="icon" type="image/svg+xml" href="resim.svg">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="/components/navbar.css" />
  
  <style>
    .notebooks-main {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .notebooks-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    
    .notebooks-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text);
    }
    
    .notebooks-header p {
      color: var(--muted);
      font-size: 0.85rem;
    }
    
    .notebooks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }
    
    .notebook-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
    }
    
    .notebook-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(139,92,246,0.1);
    }
    
    .notebook-card.active {
      border-color: var(--accent);
      background: rgba(139,92,246,0.05);
    }
    
    .notebook-card .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    
    .notebook-card .card-color {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    
    .notebook-card .card-actions {
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    
    .notebook-card:hover .card-actions {
      opacity: 1;
    }
    
    .notebook-card .card-actions button {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
      font-size: 12px;
    }
    
    .notebook-card .card-actions button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    
    .notebook-card .card-actions button.danger:hover {
      border-color: var(--red);
      color: var(--red);
    }
    
    .notebook-card .card-name {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.25rem;
    }
    
    .notebook-card .card-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
    
    .notebook-card .card-stats {
      display: flex;
      gap: 1rem;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    
    .notebook-card .card-stats span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .notebook-card .card-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.15rem 0.6rem;
      border-radius: 20px;
      background: rgba(139,92,246,0.1);
      color: var(--accent);
      border: 1px solid rgba(139,92,246,0.2);
      cursor: pointer;
    }
    
    .notebook-card .card-badge.active-badge {
      background: rgba(34,197,94,0.1);
      color: var(--green);
      border-color: rgba(34,197,94,0.2);
      cursor: default;
    }
    
    .add-notebook-card {
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      min-height: 200px;
    }
    
    .add-notebook-card:hover {
      border-color: var(--accent);
      background: rgba(139,92,246,0.03);
    }
    
    .add-notebook-card .add-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(139,92,246,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }
    
    .add-notebook-card .add-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
    }
    
    .add-notebook-card .add-limit {
      font-size: 11px;
      color: var(--muted);
      opacity: 0.6;
    }
    
    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    
    .modal-overlay.active {
      display: flex;
    }
    
    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      overflow: hidden;
      animation: modalIn 0.25s ease;
    }
    
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.35rem;
      border-bottom: 1px solid var(--border);
    }
    
    .modal-header h3 {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }
    
    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
    }
    
    .modal-body {
      padding: 1.25rem 1.35rem;
    }
    
    .modal-field {
      margin-bottom: 0.9rem;
    }
    
    .modal-field label {
      display: block;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    
    .modal-field input,
    .modal-field textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      outline: none;
    }
    
    .modal-field input:focus,
    .modal-field textarea:focus {
      border-color: var(--accent);
    }
    
    .modal-field input[type="color"] {
      height: 44px;
      padding: 4px;
      cursor: pointer;
    }
    
    .modal-footer {
      display: flex;
      gap: 0.6rem;
      justify-content: flex-end;
      padding: 0.9rem 1.35rem 1.25rem;
      border-top: 1px solid var(--border);
    }
    
    .btn-modal-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 0.55rem 1.15rem;
      border-radius: 8px;
      cursor: pointer;
    }
    
    .btn-modal-cancel:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    
    .btn-modal-confirm {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 13px;
      padding: 0.55rem 1.35rem;
      border-radius: 8px;
      cursor: pointer;
    }
    
    .btn-modal-confirm:hover {
      box-shadow: 0 4px 12px rgba(139,92,246,0.4);
    }
    
    @media (max-width: 768px) {
      .notebooks-main { padding: 1rem; }
      .notebooks-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div id="navbar-container"></div>

  <main class="notebooks-main">
    <div class="notebooks-header">
      <div>
        <h1>📓 Defterler</h1>
        <p>Tüm defterlerini yönet ve aralarında geçiş yap.</p>
      </div>
      <div style="display:flex;gap:0.5rem;align-items:center;">
        <span id="notebook-limit" style="font-size:12px;color:var(--muted);"></span>
        <button class="btn btn-primary" id="add-notebook-btn">+ Yeni Defter</button>
      </div>
    </div>

    <div class="notebooks-grid" id="notebooks-grid">
      <!-- Dinamik olarak doldurulacak -->
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="notebook-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">Yeni Defter Oluştur</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-notebook-id" />
        <div class="modal-field">
          <label>Defter Adı *</label>
          <input type="text" id="notebook-name" placeholder="Örn: Forex İşlemleri" />
        </div>
        <div class="modal-field">
          <label>Açıklama</label>
          <textarea id="notebook-desc" rows="2" placeholder="Bu defter hakkında kısa bir not..."></textarea>
        </div>
        <div class="modal-field">
          <label>Renk</label>
          <input type="color" id="notebook-color" value="#7c6dfa" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-modal-cancel" id="modal-cancel">İptal</button>
        <button class="btn-modal-confirm" id="modal-save">Kaydet</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="script.js"></script>
  <script src="/components/navbar.js"></script>
  
  <script>
    // ============================================================
    // 📌 NAVBAR YÜKLE
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof loadNavbar === 'function') {
        loadNavbar('navbar-container');
      }
      loadNotebooks();
    });

    let currentNotebooks = [];
    let tradeCounts = {};

    // ============================================================
    // 📌 VARSAYILAN DEFTER OLUŞTUR
    // ============================================================
    async function createDefaultNotebook(userId) {
        try {
            const { data, error } = await sb
                .from('notebooks')
                .insert([{
                    user_id: userId,
                    name: '📓 Ana Defter',
                    description: 'Otomatik oluşturulan ana defteriniz.',
                    color: '#7c6dfa',
                    is_active: true
                }])
                .select()
                .single();

            if (error) throw error;
            console.log('✅ Varsayılan defter oluşturuldu:', data);
            return data;
        } catch (e) {
            console.error('createDefaultNotebook hatası:', e);
            return null;
        }
    }

    // ============================================================
    // 📌 DEFTER İSTATİSTİKLERİNİ GETİR
    // ============================================================
    async function getNotebookTradeCounts(userId) {
        try {
            const { data, error } = await sb
                .from('trades')
                .select('notebook_id')
                .eq('user_id', userId);

            if (error) throw error;

            const counts = {};
            (data || []).forEach(t => {
                if (t.notebook_id) {
                    counts[t.notebook_id] = (counts[t.notebook_id] || 0) + 1;
                }
            });
            return counts;
        } catch (e) {
            console.error('getNotebookTradeCounts hatası:', e);
            return {};
        }
    }

    // ============================================================
    // 📌 DEFTERLERİ YÜKLE
    // ============================================================
    async function loadNotebooks() {
        try {
            const user = await requireAuth();
            if (!user) return;

            // TÜM defterleri getir
            const { data: notebooks, error } = await sb
                .from('notebooks')
                .select('*')
                .eq('user_id', user.id)
                .order('created_at', { ascending: true });

            if (error) throw error;

            // 📌 Eğer hiç defter yoksa otomatik oluştur
            if (!notebooks || notebooks.length === 0) {
                await createDefaultNotebook(user.id);
                return loadNotebooks();
            }

            currentNotebooks = notebooks;

            // 📌 İşlem sayılarını getir
            tradeCounts = await getNotebookTradeCounts(user.id);

            // 📌 Sadece aktif olanları göster
            const activeNotebooks = notebooks.filter(n => n.is_active === true);
            
            // 📌 Eğer hiç aktif defter yoksa ilkini aktif yap
            if (activeNotebooks.length === 0 && notebooks.length > 0) {
                const first = notebooks[0];
                await sb
                    .from('notebooks')
                    .update({ is_active: true })
                    .eq('id', first.id);
                return loadNotebooks();
            }

            renderNotebooks(activeNotebooks);

        } catch (e) {
            console.error('loadNotebooks hatası:', e);
            showToast(e.message || 'Defterler yüklenemedi.', 'error');
        }
    }

    // ============================================================
    // 📌 DEFTERLERİ RENDER ET
    // ============================================================
    function renderNotebooks(notebooks) {
        const plan = window.SETTINGS_STATE?.plan || 'free';
        const maxNotebooks = plan === 'premium' ? 10 : 2;
        const limitEl = document.getElementById('notebook-limit');
        if (limitEl) {
            limitEl.textContent = `${notebooks.length} / ${maxNotebooks}`;
        }

        const active = getActiveNotebook();
        const grid = document.getElementById('notebooks-grid');
        
        if (notebooks.length === 0) {
            grid.innerHTML = `
                <div class="add-notebook-card" onclick="openCreateModal()">
                    <div class="add-icon">+</div>
                    <div class="add-text">İlk Defterini Oluştur</div>
                    <div class="add-limit">${maxNotebooks} defter hakkın var</div>
                </div>
            `;
            return;
        }

        let html = '';
        
        notebooks.forEach(n => {
            const isActive = n.id === active;
            const tradeCount = tradeCounts[n.id] || 0;
            
            html += `
                <div class="notebook-card ${isActive ? 'active' : ''}" data-id="${n.id}">
                    <div class="card-top">
                        <div class="card-color" style="background:${n.color}"></div>
                        <div class="card-actions">
                            <button onclick="event.stopPropagation();openEditModal('${n.id}')" title="Düzenle">✎</button>
                            ${notebooks.length > 1 ? `<button class="danger" onclick="event.stopPropagation();deleteNotebookHandler('${n.id}')" title="Sil">🗑️</button>` : ''}
                        </div>
                    </div>
                    <div class="card-name">${sanitizeHTML(n.name)}</div>
                    ${n.description ? `<div class="card-desc">${sanitizeHTML(n.description)}</div>` : ''}
                    <div class="card-stats">
                        <span>📊 ${tradeCount} işlem</span>
                    </div>
                    ${isActive ? '<div class="card-badge active-badge">✓ Aktif</div>' : '<div class="card-badge" onclick="event.stopPropagation();switchNotebook(\''+n.id+'\')">Aktif Et</div>'}
                </div>
            `;
        });

        if (notebooks.length < maxNotebooks) {
            html += `
                <div class="add-notebook-card" onclick="openCreateModal()">
                    <div class="add-icon">+</div>
                    <div class="add-text">Yeni Defter Ekle</div>
                    <div class="add-limit">${notebooks.length} / ${maxNotebooks} kullanıldı</div>
                </div>
            `;
        }

        grid.innerHTML = html;

        // Defter kartlarına tıklama - aktif et
        document.querySelectorAll('.notebook-card').forEach(card => {
            card.addEventListener('click', function() {
                const id = this.dataset.id;
                switchNotebook(id);
            });
        });
    }

    // ============================================================
    // 📌 DİĞER FONKSİYONLAR
    // ============================================================
    
    function sanitizeHTML(str) {
        if (!str) return '';
        const temp = document.createElement('div');
        temp.textContent = str;
        return temp.innerHTML;
    }

    async function switchNotebook(id) {
        try {
            setActiveNotebook(id);
            showToast('Defter değiştirildi!', 'success');
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 500);
        } catch (e) {
            showToast('Defter değiştirilemedi.', 'error');
        }
    }

    function openCreateModal() {
        document.getElementById('modal-title').textContent = 'Yeni Defter Oluştur';
        document.getElementById('edit-notebook-id').value = '';
        document.getElementById('notebook-name').value = '';
        document.getElementById('notebook-desc').value = '';
        document.getElementById('notebook-color').value = '#7c6dfa';
        document.getElementById('notebook-modal').classList.add('active');
    }

    function openEditModal(id) {
        const notebook = currentNotebooks.find(n => n.id === id);
        if (!notebook) return;
        
        document.getElementById('modal-title').textContent = 'Defter Düzenle';
        document.getElementById('edit-notebook-id').value = id;
        document.getElementById('notebook-name').value = notebook.name;
        document.getElementById('notebook-desc').value = notebook.description || '';
        document.getElementById('notebook-color').value = notebook.color || '#7c6dfa';
        document.getElementById('notebook-modal').classList.add('active');
    }

    async function deleteNotebookHandler(id) {
        if (!confirm('Bu defteri silmek istediğinize emin misiniz? İşlemler silinmeyecek, varsayılan deftere taşınacaktır.')) return;
        
        try {
            await deleteNotebook(id);
            showToast('Defter silindi.', 'success');
            loadNotebooks();
        } catch (e) {
            showToast(e.message || 'Defter silinemedi.', 'error');
        }
    }

    // ============================================================
    // 📌 MODAL EVENTS
    // ============================================================
    document.getElementById('add-notebook-btn').addEventListener('click', openCreateModal);
    document.getElementById('modal-close').addEventListener('click', () => {
        document.getElementById('notebook-modal').classList.remove('active');
    });
    document.getElementById('modal-cancel').addEventListener('click', () => {
        document.getElementById('notebook-modal').classList.remove('active');
    });
    document.getElementById('notebook-modal').addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('active');
    });

    document.getElementById('modal-save').addEventListener('click', async function() {
        const id = document.getElementById('edit-notebook-id').value;
        const name = document.getElementById('notebook-name').value.trim();
        const description = document.getElementById('notebook-desc').value.trim();
        const color = document.getElementById('notebook-color').value;

        if (!name) {
            showToast('Defter adı boş olamaz.', 'error');
            return;
        }

        try {
            if (id) {
                await updateNotebook(id, { name, description, color });
                showToast('Defter güncellendi.', 'success');
            } else {
                await createNotebook(name, description, color);
                showToast('Defter oluşturuldu.', 'success');
            }
            document.getElementById('notebook-modal').classList.remove('active');
            loadNotebooks();
        } catch (e) {
            showToast(e.message || 'İşlem başarısız.', 'error');
        }
    });
  </script>
</body>
</html>
