<!-- ============================================================
   NOTIFICATION BELL - BİLDİRİM BİLEŞENİ (i18n UYUMLU)
   Tüm sayfalarda avatarın yanına eklenir.
   ============================================================ -->

<style>
  /* ============================================================
     BİLDİRİM BELL - GENEL STİLLER
     ============================================================ */
  .notif-bell-wrapper {
    position: relative;
    display: inline-flex;
    align-items: center;
    margin-right: 4px;
  }

  .notif-btn {
    position: relative;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    font-size: 16px;
    flex-shrink: 0;
  }
  .notif-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(139,92,246,0.08);
    transform: scale(1.05);
  }
  .notif-btn:active {
    transform: scale(0.92);
  }
  .notif-btn.has-notif {
    border-color: rgba(239,68,68,0.5);
    color: var(--red);
    animation: notifPulse 2s ease-in-out infinite;
  }
  .notif-btn.has-notif:hover {
    border-color: var(--red);
    background: rgba(239,68,68,0.08);
  }

  @keyframes notifPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.2); }
    50% { box-shadow: 0 0 0 4px rgba(239,68,68,0.08); }
  }

  .notif-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 99px;
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(239,68,68,0.4);
    transition: transform 0.2s ease;
    pointer-events: none;
    line-height: 1;
  }
  .notif-badge.hidden {
    transform: scale(0);
    opacity: 0;
  }

  /* ============================================================
     BİLDİRİM PANELİ - DROPDOWN
     ============================================================ */
  .notif-panel {
    position: absolute;
    top: 44px;
    right: 0;
    width: 380px;
    max-width: calc(100vw - 2rem);
    max-height: 480px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(139,92,246,0.06);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px) scale(0.97);
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 9999;
    overflow: hidden;
    transform-origin: top right;
    backdrop-filter: blur(16px);
  }
  .notif-panel.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
  }

  .notif-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  .notif-panel-header h4 {
    font-family: 'Syne', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text);
    margin: 0;
    letter-spacing: -0.02em;
  }
  .notif-panel-header .notif-clear-all {
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 500;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .notif-panel-header .notif-clear-all:hover {
    color: var(--red);
    background: rgba(239,68,68,0.06);
  }

  .notif-panel-body {
    max-height: 380px;
    overflow-y: auto;
    padding: 0.25rem 0;
  }
  .notif-panel-body::-webkit-scrollbar {
    width: 3px;
  }
  .notif-panel-body::-webkit-scrollbar-thumb {
    background: var(--border2);
    border-radius: 99px;
  }

  .notif-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s ease;
    cursor: default;
  }
  .notif-item:last-child {
    border-bottom: none;
  }
  .notif-item:hover {
    background: rgba(139,92,246,0.04);
  }
  .notif-item .notif-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 16px;
  }
  .notif-item .notif-icon.danger {
    background: rgba(239,68,68,0.12);
  }
  .notif-item .notif-icon.warning {
    background: rgba(251,191,36,0.12);
  }
  .notif-item .notif-icon.info {
    background: rgba(59,130,246,0.12);
  }
  .notif-item .notif-icon.success {
    background: rgba(34,197,94,0.12);
  }

  .notif-item .notif-content {
    flex: 1;
    min-width: 0;
  }
  .notif-item .notif-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 1px;
    line-height: 1.3;
  }
  .notif-item .notif-desc {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
  }
  .notif-item .notif-time {
    font-family: 'DM Mono', monospace;
    font-size: 8px;
    color: var(--muted);
    opacity: 0.6;
    margin-top: 3px;
    display: block;
  }
  .notif-item .notif-close {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    padding: 4px;
    border-radius: 4px;
    transition: all 0.2s;
    opacity: 0.4;
    flex-shrink: 0;
  }
  .notif-item .notif-close:hover {
    opacity: 1;
    color: var(--text);
    background: rgba(255,255,255,0.05);
  }

  .notif-empty {
    text-align: center;
    padding: 2.5rem 1rem;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
  }
  .notif-empty .empty-icon {
    font-size: 2rem;
    margin-bottom: 0.5rem;
    display: block;
  }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 480px) {
    .notif-panel {
      width: 320px;
      right: -50px;
    }
    .notif-item {
      padding: 0.5rem 0.75rem;
    }
    .notif-item .notif-title {
      font-size: 11.5px;
    }
    .notif-item .notif-desc {
      font-size: 10px;
    }
  }
</style>

<!-- ============================================================
   HTML YAPISI - i18n ETİKETLERİ EKLENDİ
   ============================================================ -->
<div class="notif-bell-wrapper">
  <!-- Bildirim Butonu -->
  <button class="notif-btn" id="notifBell" aria-label="Bildirimler">
    🔔
    <span class="notif-badge hidden" id="notifBadge">0</span>
  </button>

  <!-- Bildirim Paneli -->
  <div class="notif-panel" id="notifPanel">
    <div class="notif-panel-header">
      <!-- ⭐ i18n ile "Bildirimler" -->
      <h4 data-i18n="nav.notifications">🔔 Bildirimler</h4>
      <!-- ⭐ i18n ile "Tümünü Temizle" -->
      <button class="notif-clear-all" id="notifClearAll" data-i18n="nav.clear_all">Tümünü Temizle</button>
    </div>
    <div class="notif-panel-body" id="notifBody">
      <!-- ⭐ i18n ile boş bildirim mesajı -->
      <div class="notif-empty" data-i18n="nav.no_notifications">
        <span class="empty-icon">📭</span>
        Henüz bildirim yok.
      </div>
    </div>
  </div>
</div>

<!-- ============================================================
   JAVASCRIPT - i18n UYUMLU
   ============================================================ -->
<script>
  (function() {
    // ⭐ Bildirim yöneticisi
    class NotificationManager {
      constructor() {
        this.notifications = [];
        this.listeners = [];
        this.loadFromStorage();
        this.startAutoCleanup();
      }

      loadFromStorage() {
        try {
          const saved = localStorage.getItem('ww_notifications');
          if (saved) {
            this.notifications = JSON.parse(saved);
            const sevenDaysAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
            this.notifications = this.notifications.filter(n => n.timestamp > sevenDaysAgo);
            this.saveToStorage();
          }
        } catch (e) {
          this.notifications = [];
        }
      }

      saveToStorage() {
        try {
          localStorage.setItem('ww_notifications', JSON.stringify(this.notifications));
        } catch (e) {}
      }

      add(notification) {
        const newNotif = {
          id: 'notif_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
          timestamp: Date.now(),
          read: false,
          ...notification
        };
        this.notifications.unshift(newNotif);
        if (this.notifications.length > 100) {
          this.notifications = this.notifications.slice(0, 100);
        }
        this.saveToStorage();
        this.notifyListeners();
        return newNotif;
      }

      markAsRead(id) {
        const notif = this.notifications.find(n => n.id === id);
        if (notif) {
          notif.read = true;
          this.saveToStorage();
          this.notifyListeners();
        }
      }

      markAllAsRead() {
        this.notifications.forEach(n => n.read = true);
        this.saveToStorage();
        this.notifyListeners();
      }

      clearAll() {
        this.notifications = [];
        this.saveToStorage();
        this.notifyListeners();
      }

      getUnreadCount() {
        return this.notifications.filter(n => !n.read).length;
      }

      getAll() {
        return this.notifications;
      }

      getUnread() {
        return this.notifications.filter(n => !n.read);
      }

      onUpdate(callback) {
        this.listeners.push(callback);
      }

      notifyListeners() {
        this.listeners.forEach(cb => cb(this.notifications));
      }

      startAutoCleanup() {
        setInterval(() => {
          const sevenDaysAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
          const before = this.notifications.length;
          this.notifications = this.notifications.filter(n => n.timestamp > sevenDaysAgo);
          if (before !== this.notifications.length) {
            this.saveToStorage();
            this.notifyListeners();
          }
        }, 10 * 60 * 1000);
      }
    }

    // ⭐ Global notification manager
    if (!window.notificationManager) {
      window.notificationManager = new NotificationManager();
    }

    // ⭐ i18n uyumlu UI güncellemesi
    function updateNotificationUI() {
      const badge = document.getElementById('notifBadge');
      const bell = document.getElementById('notifBell');
      const body = document.getElementById('notifBody');
      
      if (!badge || !bell) return;
      
      const count = window.notificationManager.getUnreadCount();
      
      if (count > 0) {
        badge.textContent = count > 99 ? '99+' : count;
        badge.classList.remove('hidden');
        bell.classList.add('has-notif');
      } else {
        badge.classList.add('hidden');
        bell.classList.remove('has-notif');
      }
      
      if (body) {
        const notifications = window.notificationManager.getAll();
        if (notifications.length === 0) {
          // ⭐ i18n uyumlu boş mesaj
          const emptyText = (typeof i18n !== 'undefined' && i18n.t('nav.no_notifications')) || 'Henüz bildirim yok.';
          body.innerHTML = `
            <div class="notif-empty">
              <span class="empty-icon">📭</span>
              ${emptyText}
            </div>
          `;
        } else {
          body.innerHTML = notifications.map(n => {
            const isRead = n.read ? '' : 'style="background:rgba(139,92,246,0.04);"';
            const timeAgo = getTimeAgoSimple(n.timestamp);
            const iconClass = n.type === 'overtrade_critical' ? 'danger' :
                              n.type === 'overtrade_warning' ? 'warning' :
                              n.type === 'premium_expired' ? 'danger' :
                              n.type === 'premium_upgraded' ? 'success' : 'info';
            
            return `
              <div class="notif-item" data-id="${n.id}" ${isRead}>
                <div class="notif-icon ${iconClass}">${n.icon || 'ℹ️'}</div>
                <div class="notif-content">
                  <div class="notif-title">${n.title}</div>
                  <div class="notif-desc">${n.description}</div>
                  <span class="notif-time">${timeAgo}</span>
                </div>
                <button class="notif-close" onclick="dismissNotification('${n.id}')">✕</button>
              </div>
            `;
          }).join('');
        }
      }
    }

    // ⭐ Zaman formatı
    function getTimeAgoSimple(timestamp) {
      const diff = Date.now() - timestamp;
      const seconds = Math.floor(diff / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);
      
      if (days > 0) return days + ' gün önce';
      if (hours > 0) return hours + ' saat önce';
      if (minutes > 0) return minutes + ' dakika önce';
      return 'az önce';
    }

    // ⭐ Bildirim kapat
    window.dismissNotification = function(id) {
      window.notificationManager.markAsRead(id);
      updateNotificationUI();
    };

    // ⭐ Tüm bildirimleri temizle
    window.clearAllNotifications = function() {
      window.notificationManager.clearAll();
      updateNotificationUI();
    };

    // ⭐ Panel aç/kapat
    window.toggleNotificationPanel = function() {
      const panel = document.getElementById('notifPanel');
      if (panel) {
        panel.classList.toggle('open');
        if (panel.classList.contains('open')) {
          window.notificationManager.markAllAsRead();
          updateNotificationUI();
        }
      }
    };

    // ⭐ Event listener'lar
    document.addEventListener('DOMContentLoaded', function() {
      const bell = document.getElementById('notifBell');
      if (bell) {
        bell.addEventListener('click', function(e) {
          e.stopPropagation();
          window.toggleNotificationPanel();
        });
      }
      
      document.addEventListener('click', function(e) {
        const panel = document.getElementById('notifPanel');
        const bell = document.getElementById('notifBell');
        if (panel && panel.classList.contains('open')) {
          if (!panel.contains(e.target) && !bell.contains(e.target)) {
            panel.classList.remove('open');
          }
        }
      });
      
      const clearBtn = document.getElementById('notifClearAll');
      if (clearBtn) {
        clearBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          // ⭐ i18n uyumlu onay
          const confirmText = (typeof i18n !== 'undefined' && i18n.t('nav.confirm_clear_all')) || 'Tüm bildirimleri temizlemek istediğinize emin misiniz?';
          if (confirm(confirmText)) {
            window.clearAllNotifications();
          }
        });
      }
      
      // ⭐ i18n değişiminde UI'ı güncelle
      if (typeof i18n !== 'undefined' && i18n.onChange) {
        i18n.onChange(function() {
          updateNotificationUI();
        });
      }
      
      setTimeout(updateNotificationUI, 300);
      
      window.notificationManager.onUpdate(function() {
        updateNotificationUI();
      });
      
      // ⭐ Over Trade bildirim kontrolü
      setInterval(() => {
        if (window.notificationManager && typeof window.notificationManager.checkAll === 'function') {
          window.notificationManager.checkAll();
        }
      }, 5 * 60 * 1000);
      
      setTimeout(() => {
        if (window.notificationManager && typeof window.notificationManager.checkAll === 'function') {
          window.notificationManager.checkAll();
        }
      }, 3000);
    });

    // ⭐ Global export
    window.NotificationManager = NotificationManager;
    window.updateNotificationUI = updateNotificationUI;

    console.log('✅ Notification bell loaded! (i18n uyumlu)');
  })();
</script>
