<div class="s-card appearance-card">
  <div class="s-card-header">
    <div class="s-card-header-icon">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="5"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </div>
    <div>
      <h2 data-i18n="settings.appearance">Görünüm</h2>
      <p data-i18n="settings.appearance_desc">Tema, arka plan ışığı ve renkler</p>
    </div>
  </div>

  <div class="s-card-body">

    <!-- 1. TEMA MODU SEÇİMİ (GÖRSEL KARTLAR) -->
    <div class="appearance-section">
      <div class="appearance-section-header">
        <span class="appearance-section-title" data-i18n="settings.interface_theme">Arayüz modu</span>
        <span class="appearance-section-subtitle" data-i18n="settings.theme_mode_subtitle">Çalışma alanının görünümünü seç</span>
      </div>

      <div class="theme-mode-cards">
        <!-- Koyu Tema Kartı -->
        <div class="theme-mode-card active" id="theme-mode-dark" onclick="selectThemeMode('dark')">
          <div class="mode-preview mode-preview-dark">
            <div class="mock-nav">
              <span class="mock-dot"></span>
              <span class="mock-line" style="width: 38px;"></span>
            </div>
            <div class="mock-body">
              <div class="mock-sidebar">
                <span class="mock-bar active"></span>
                <span class="mock-bar"></span>
                <span class="mock-bar"></span>
              </div>
              <div class="mock-content">
                <div class="mock-card">
                  <div class="mock-chart-line"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="mode-info">
            <div class="mode-name-row">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              <span class="mode-name" data-i18n="settings.dark_theme">Koyu Tema</span>
            </div>
            <span class="mode-desc" data-i18n="settings.dark_theme_desc">Göz yormayan karanlık arayüz</span>
          </div>
          <span class="mode-check">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
        </div>

        <!-- Açık Tema Kartı -->
        <div class="theme-mode-card" id="theme-mode-light" onclick="selectThemeMode('light')">
          <div class="mode-preview mode-preview-light">
            <div class="mock-nav">
              <span class="mock-dot"></span>
              <span class="mock-line" style="width: 38px;"></span>
            </div>
            <div class="mock-body">
              <div class="mock-sidebar">
                <span class="mock-bar active"></span>
                <span class="mock-bar"></span>
                <span class="mock-bar"></span>
              </div>
              <div class="mock-content">
                <div class="mock-card">
                  <div class="mock-chart-line"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="mode-info">
            <div class="mode-name-row">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
              <span class="mode-name" data-i18n="settings.light_theme">Açık Tema</span>
            </div>
            <span class="mode-desc" data-i18n="settings.light_theme_desc">Aydınlık ve ferah görünüm</span>
          </div>
          <span class="mode-check">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
        </div>
      </div>

      <!-- Gizli input checkbox - toggleTheme() ve diğer dinleyicilerle senkron -->
      <input type="checkbox" id="theme-toggle" onchange="toggleTheme()" style="display:none;" />
    </div>

    <!-- 2. ARKA PLAN AMBİYANSI -->
    <div class="appearance-section">
      <div class="settings-group-card">
        <!-- DİNAMİK ARKA PLAN AMBİYANSI (PnL GLOW) -->
        <div class="pref-row ambient-pref-row">
          <div class="pref-left">
            <div class="pref-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 3a9 9 0 0 1 9 9 9 9 0 0 1-9 9"/>
              </svg>
            </div>
            <div>
              <div class="pref-title" style="display:flex; align-items:center; gap:8px;">
                <span data-i18n="settings.ambient_title">Arka plan ambiyansı</span>
                <span class="ambient-indicator-dot" id="ambient-current-indicator"></span>
              </div>
              <div class="pref-desc" data-i18n="settings.ambient_desc">Kârda yeşil, zararda kırmızı, nötrde mor ışık</div>
            </div>
          </div>
          <div class="ambient-selector-compact" id="settings-ambient-selector">
            <button type="button" class="ambient-mode-btn" data-mode="dynamic" data-i18n="settings.ambient_dynamic">Dinamik PnL</button>
            <button type="button" class="ambient-mode-btn" data-mode="classic" data-i18n="settings.ambient_classic">Klasik mor</button>
            <button type="button" class="ambient-mode-btn" data-mode="off" data-i18n="settings.ambient_off">Kapalı</button>
          </div>
        </div>

        <!-- AMBIYANS ANLIK CANLI TEST ŞERİDİ -->
        <div class="ambient-test-row" id="ambient-test-row">
          <span class="ambient-test-label" data-i18n="settings.ambient_test">Önizle:</span>
          <div class="ambient-test-chips">
            <button type="button" class="ambient-test-chip profit" onclick="window.testAmbientState('profit')">
              <span class="chip-dot"></span> <span data-i18n="settings.ambient_profit">Kâr</span>
            </button>
            <button type="button" class="ambient-test-chip loss" onclick="window.testAmbientState('loss')">
              <span class="chip-dot"></span> <span data-i18n="settings.ambient_loss">Zarar</span>
            </button>
            <button type="button" class="ambient-test-chip neutral" onclick="window.testAmbientState('neutral')">
              <span class="chip-dot"></span> <span data-i18n="settings.ambient_neutral">Nötr</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. TEMA STÜDYOSU (PRO): varsayılan kapalı, açık/kapalı durumu hatırlanır -->
    <details class="appearance-section studio-disclosure" id="theme-customization-section">
      <summary class="studio-summary">
        <span class="studio-summary-text">
          <span class="studio-summary-title">
            <span data-i18n="settings.theme_studio">Tema stüdyosu</span>
            <span class="pro-badge">PRO</span>
          </span>
          <span class="appearance-section-subtitle" data-i18n="settings.theme_studio_desc">Renk paleti, özel renkler ve yazı boyutu</span>
        </span>
        <svg class="studio-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </summary>
      <div class="studio-body" id="theme-customization-container"></div>
    </details>

  </div>
</div>

<!-- ============================================================
     TEMPLATE: FORM
     ============================================================ -->
<template id="tpl-theme-form">
  <div class="theme-form">
    <!-- Bilgi Şeridi -->
    <div class="theme-notice-minimal">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span data-i18n="settings.studio_notice">Renk ve yazı ayarları anında önizlenir ve koyu temada saklanır.</span>
    </div>

    <!-- Küratörlü Hazır Paletler (Sitenin renk dünyasına sadık) -->
    <div class="theme-subblock">
      <div class="theme-subblock-title" data-i18n="settings.studio_presets">Hazır paletler</div>
      <div class="theme-preset-grid">
        <button type="button" class="preset-card active" data-preset="obsidian" title="Wawe Varsayılan Paleti">
          <div class="preset-swatches">
            <span style="background: #07070c;"></span>
            <span style="background: #0e0e16;"></span>
            <span style="background: #1a1a28;"></span>
            <span style="background: #8b5cf6;"></span>
          </div>
          <span class="preset-name">Obsidian <span data-i18n="settings.studio_default_tag">(varsayılan)</span></span>
        </button>

        <button type="button" class="preset-card" data-preset="violet" title="Derin Mor & Neon">
          <div class="preset-swatches">
            <span style="background: #080612;"></span>
            <span style="background: #120e24;"></span>
            <span style="background: #261e47;"></span>
            <span style="background: #a855f7;"></span>
          </div>
          <span class="preset-name">Deep Violet</span>
        </button>

        <button type="button" class="preset-card" data-preset="slate" title="Gece Mavisi & Grafit">
          <div class="preset-swatches">
            <span style="background: #090d14;"></span>
            <span style="background: #0f172a;"></span>
            <span style="background: #1e293b;"></span>
            <span style="background: #38bdf8;"></span>
          </div>
          <span class="preset-name">Midnight Slate</span>
        </button>

        <button type="button" class="preset-card" data-preset="stealth" title="Monokrom Siyah & Beyaz">
          <div class="preset-swatches">
            <span style="background: #000000;"></span>
            <span style="background: #0c0c0e;"></span>
            <span style="background: #242428;"></span>
            <span style="background: #ffffff;"></span>
          </div>
          <span class="preset-name">Pure Stealth</span>
        </button>
      </div>
    </div>

    <!-- Özel Renk Ayarları -->
    <div class="theme-subblock">
      <div class="theme-subblock-title" data-i18n="settings.studio_custom">Özel renkler</div>
      <div class="color-grid">
        <div class="color-field">
          <label data-i18n="settings.theme_bg_color">Arka Plan Rengi</label>
          <div class="color-input-group">
            <div class="color-chip" id="chip-bg" style="background:#07070c;" title="Rengi Seç">
              <input type="color" id="custom-bg-color" class="color-input-picker" value="#07070c">
            </div>
            <input type="text" id="custom-bg-color-text" class="color-input-text" value="#07070c" spellcheck="false" maxlength="7">
          </div>
        </div>

        <div class="color-field">
          <label data-i18n="settings.theme_surface_color">Kart Arka Planı</label>
          <div class="color-input-group">
            <div class="color-chip" id="chip-surface" style="background:#0e0e16;" title="Rengi Seç">
              <input type="color" id="custom-surface-color" class="color-input-picker" value="#0e0e16">
            </div>
            <input type="text" id="custom-surface-color-text" class="color-input-text" value="#0e0e16" spellcheck="false" maxlength="7">
          </div>
        </div>

        <div class="color-field">
          <label data-i18n="settings.theme_border_color">Kenarlık Rengi</label>
          <div class="color-input-group">
            <div class="color-chip" id="chip-border" style="background:#1a1a28;" title="Rengi Seç">
              <input type="color" id="custom-border-color" class="color-input-picker" value="#1a1a28">
            </div>
            <input type="text" id="custom-border-color-text" class="color-input-text" value="#1a1a28" spellcheck="false" maxlength="7">
          </div>
        </div>

        <div class="color-field">
          <label data-i18n="settings.theme_text_color">Metin Rengi</label>
          <div class="color-input-group">
            <div class="color-chip" id="chip-text" style="background:#f0f0f8;" title="Rengi Seç">
              <input type="color" id="custom-text-color" class="color-input-picker" value="#f0f0f8">
            </div>
            <input type="text" id="custom-text-color-text" class="color-input-text" value="#f0f0f8" spellcheck="false" maxlength="7">
          </div>
        </div>
      </div>
    </div>

    <!-- Font Boyutu -->
    <div class="theme-subblock">
      <div class="font-size-header-row">
        <label>
          <span data-i18n="settings.theme_font_size">Font Ölçeği</span>:
          <span id="font-size-display" class="font-badge">16px</span>
        </label>
        <div class="font-quick-pills">
          <button type="button" class="font-pill" data-size="14" data-i18n="settings.font_compact">Kompakt (14px)</button>
          <button type="button" class="font-pill active" data-size="16" data-i18n="settings.font_standard">Standart (16px)</button>
          <button type="button" class="font-pill" data-size="18" data-i18n="settings.font_large">Geniş (18px)</button>
        </div>
      </div>
      <div class="slider-wrapper">
        <input type="range" id="custom-font-size" min="12" max="22" step="1" value="16" class="custom-range-slider">
        <div class="slider-marks">
          <span>12px</span><span>16px</span><span>22px</span>
        </div>
      </div>
    </div>

    <!-- Canlı Önizleme: Gerçek Mini Trade Kartı -->
    <div class="theme-subblock">
      <div class="theme-subblock-title" data-i18n="settings.studio_preview">Önizleme</div>
      <div id="theme-preview-box" class="theme-preview-box">
        <div class="mini-trade-preview">
          <div class="mini-trade-header">
            <div class="mini-trade-pair">
              <span class="mini-trade-symbol">EURUSD</span>
              <span class="mini-trade-dir long">BUY · 1.00 Lot</span>
            </div>
            <div class="mini-trade-pnl positive">+$420.00 (+2.1R)</div>
          </div>
          <div class="mini-trade-details">
            <span><span data-i18n="settings.preview_entry">Giriş:</span> <strong class="preview-text-contrast">1.0845</strong></span>
            <span><span data-i18n="settings.preview_exit">Çıkış:</span> <strong class="preview-text-contrast">1.0887</strong></span>
            <span><span data-i18n="settings.preview_strategy">Strateji:</span> <strong class="preview-text-contrast">Breakout V2</strong></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Aksiyon Butonları -->
    <div class="theme-actions">
      <button type="button" class="btn-theme-primary" id="save-custom-theme-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="20 6 9 17 4 12"/></svg>
        <span data-i18n="settings.theme_save">Temayı Kaydet</span>
      </button>
      <button type="button" class="btn-theme-ghost" id="reset-custom-theme-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        <span data-i18n="settings.theme_reset">Varsayılana Dön</span>
      </button>
    </div>
  </div>
</template>
