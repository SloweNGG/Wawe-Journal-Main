<div class="s-card">
  <div class="s-card-header">
    <div class="s-card-header-icon">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <div>
      <h2 data-i18n="settings.change_password">Şifre Değiştir</h2>
      <p data-i18n="settings.password_desc">Hesabının güvenliğini güçlü bir şifreyle koru</p>
    </div>
  </div>
  <div class="s-card-body">
    <div class="pw-field">
      <label data-i18n="settings.current_password">Mevcut Şifre</label>
      <input type="password" id="current-password" data-i18n-placeholder="settings.current_password_placeholder" placeholder="••••••••" />
      <button class="pw-toggle" type="button" onclick="togglePassword('current-password', this)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <div class="pw-field">
      <label data-i18n="settings.new_password">Yeni Şifre</label>
      <input type="password" id="new-password" data-i18n-placeholder="settings.new_password_placeholder" placeholder="En az 6 karakter" oninput="checkStrength(this.value)" />
      <button class="pw-toggle" type="button" onclick="togglePassword('new-password', this)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
      <div class="pw-strength">
        <div class="pw-strength-bar" id="bar1"></div>
        <div class="pw-strength-bar" id="bar2"></div>
        <div class="pw-strength-bar" id="bar3"></div>
        <div class="pw-strength-bar" id="bar4"></div>
      </div>
      <div class="pw-strength-label" id="pw-strength-label"></div>
    </div>
    <div class="pw-field">
      <label data-i18n="settings.confirm_password">Yeni Şifre (Tekrar)</label>
      <input type="password" id="confirm-password" data-i18n-placeholder="settings.confirm_password_placeholder" placeholder="Şifreyi tekrar gir" />
      <button class="pw-toggle" type="button" onclick="togglePassword('confirm-password', this)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <div class="msg-error" id="password-error"></div>
    <div class="msg-success" id="password-success"></div>
    <button class="btn btn-primary" id="change-password-btn" style="margin-top:.75rem; width:100%;" data-i18n="settings.update_password">Şifreyi Güncelle →</button>
  </div>
</div>
