  <script>
  (function() {
    if (document.body) {
      var savedTheme = localStorage.getItem('ww_theme');
      if (savedTheme === 'light') {
        document.body.classList.add('light-theme');
      } else {
        document.body.classList.remove('light-theme');
      }
    } else {
      document.addEventListener('DOMContentLoaded', function() {
        var savedTheme = localStorage.getItem('ww_theme');
        if (savedTheme === 'light') {
          document.body.classList.add('light-theme');
        } else {
          document.body.classList.remove('light-theme');
        }
      });
    }
  })();
  </script>

  <!-- ============================================================
       ⭐ DİL KALICILIĞI
       ============================================================ -->
  <script>
    (function() {
      var savedLang = localStorage.getItem('ww_language');
      if (savedLang && ['en', 'tr', 'de'].includes(savedLang)) {
        document.documentElement.setAttribute('data-lang', savedLang);
        document.documentElement.lang = savedLang;
        console.log('🌐 [Preload] Dil geri yüklendi:', savedLang);
      } else {
        localStorage.setItem('ww_language', 'en');
        document.documentElement.setAttribute('data-lang', 'en');
        document.documentElement.lang = 'en';
        console.log('🌐 [Preload] Varsayılan dil ayarlandı: en');
      }
    })();
  </script>

       STRATEGIES SAYFASI - DASHBOARD TASARIMI

    .strategies-main {

      overflow: hidden;

      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(139,92,246,0.15);

      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      z-index: 400;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 16px;
      max-width: 460px;
      width: 100%;
      overflow: hidden;
      animation: modal-in 0.2s ease;
    }
    @keyframes modal-in {
      from { opacity: 0; transform: scale(0.96) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.35rem;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      margin: 0;
      font-family: 'Syne', sans-serif;
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      transition: color 0.2s;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 1.25rem 1.35rem; }
    .modal-field { margin-bottom: 0.9rem; }
    .modal-field label {
      display: block;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    .modal-field input[type="text"],
    .modal-field textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
      resize: vertical;
    }
    .modal-field input[type="text"]:focus,
    .modal-field textarea:focus { border-color: var(--accent); }
    .modal-field input[type="color"] {
      width: 100%;
      height: 44px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
      cursor: pointer;
    }
    .modal-footer {
      display: flex;
      gap: 0.6rem;
      justify-content: flex-end;
      padding: 0.9rem 1.35rem 1.25rem;
    }
    .btn-modal-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 0.55rem 1.15rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;

      border-color: var(--accent);
      color: var(--text);
    }
    .btn-modal-confirm {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 13px;

  <script>
    // ⭐ GÜVENLİK: HTML SANITIZE
    function sanitizeHTML(str) {
      if (!str) return '';
      var temp = document.createElement('div');
      temp.textContent = str;
      return temp.innerHTML;
    }

    // ⭐ PREMIUM DROPDOWN TOGGLE
    document.addEventListener('DOMContentLoaded', function() {
      var dropdownBtn = document.getElementById('premium-dropdown-btn');
      var dropdownMenu = document.getElementById('premium-dropdown-menu');
      
      if (dropdownBtn && dropdownMenu) {
        dropdownBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          this.classList.toggle('active');
          dropdownMenu.classList.toggle('open');
        });
        
        document.addEventListener('click', function() {
          dropdownBtn.classList.remove('active');
          dropdownMenu.classList.remove('open');
        });
        
        dropdownMenu.addEventListener('click', function(e) {
          e.stopPropagation();
        });
      }
    });

    // 🔔 BİLDİRİM ÇANI TOGGLE
    document.addEventListener('DOMContentLoaded', function() {
      var bellBtn = document.getElementById('overtrade-bell-btn');
      var bellPanel = document.getElementById('bell-panel');
      var bellClose = document.getElementById('bell-panel-close');

      if (bellBtn && bellPanel) {
        bellBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          bellPanel.classList.toggle('open');
        });

        document.addEventListener('click', function(e) {
          if (!bellPanel.contains(e.target) && !bellBtn.contains(e.target)) {
            bellPanel.classList.remove('open');
          }
        });

        bellPanel.addEventListener('click', function(e) {
          e.stopPropagation();
        });
      }

      if (bellClose && bellPanel) {
        bellClose.addEventListener('click', function() {
          bellPanel.classList.remove('open');
        });
      }

      var markReadBtn = document.getElementById('bell-mark-read-btn');
      if (markReadBtn) {
        markReadBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (typeof markOvertradeAsRead === 'function') markOvertradeAsRead();
        });
      }
    });

    // ⭐ PLAN BADGE GÜNCELLEME
    async function updatePlanBadge() {
      var badge = document.getElementById('plan-badge');
      var text = document.getElementById('plan-text');

    function filterTradesByRange(trades, range) {
      if (!range || range === 'all') return trades;
      var now = new Date();
      var cutoff = null;
      if (range === '7d') {
        cutoff = new Date(now); cutoff.setDate(now.getDate() - 7);
      } else if (range === '30d') {
        cutoff = new Date(now); cutoff.setDate(now.getDate() - 30);
      } else if (range === '90d') {
        cutoff = new Date(now); cutoff.setDate(now.getDate() - 90);
      } else if (range === 'month') {
        cutoff = new Date(now.getFullYear(), now.getMonth(), 1);
      }
      if (!cutoff) return trades;
      return trades.filter(function(t) {
        if (!t.trade_date) return false;
        return new Date(t.trade_date) >= cutoff;
      });
    }

    function getTradeMultiplier(t) {

      if (typeof INSTRUMENT_MULTIPLIERS !== 'undefined' && INSTRUMENT_MULTIPLIERS[t.instrument]) {
        mult = t.multiplier || INSTRUMENT_MULTIPLIERS[t.instrument] || 100000;
      }

    function getTradePnL(t) {
      try {
        return calcPnL(t.entry_price, t.exit_price, t.lot, t.direction, 'other', getTradeMultiplier(t));
      } catch(e) {
        return 0;
      }
    }

    function colorToRgba(hex, alpha) {
      try {
        var r = parseInt(hex.slice(1,3),16);
        var g = parseInt(hex.slice(3,5),16);
        var b = parseInt(hex.slice(5,7),16);
        return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
      } catch(e) { 
        return hex; 
      }
    }

    // ============================================================
    // getStrategyPerformance - GÜVENLİ
    // ============================================================
    function getStrategyPerformance(strategyId) {
      try {
        var rawStrategyTrades = allTradesForStats.filter(function(t) { return t.strategy_id === strategyId; });
        var strategyTrades = filterTradesByRange(rawStrategyTrades, currentTimeRange);
        var closedTrades = strategyTrades.filter(function(t) { return t.exit_price; });
        var totalPnL = 0, wins = 0, losses = 0, openTrades = 0;
        var longCount = 0, shortCount = 0;

        strategyTrades.forEach(function(t) {
          var dir = (t.direction || '').toLowerCase();
          if (dir === 'long' || dir === 'buy') longCount++; else shortCount++;
          if (!t.exit_price) { openTrades++; return; }
          var pnl = getTradePnL(t);
          totalPnL += pnl;
          if (pnl > 0) wins++; else if (pnl < 0) losses++;
        });

        var total = closedTrades.length;
        var winRate = total > 0 ? parseFloat(((wins / total) * 100).toFixed(1)) : 0;

        var sorted = closedTrades.slice().sort(function(a, b) { return new Date(a.trade_date) - new Date(b.trade_date); });

        var cumulative = 0, peak = 0, maxDrawdown = 0;
        var grossProfit = 0, grossLoss = 0, winAmounts = [], lossAmounts = [];
        var curWinStreak = 0, curLossStreak = 0, maxWinStreak = 0, maxLossStreak = 0;
        var pnlSeries = [];
        var tradesDetail = [];
        var instrumentMap = {};

        sorted.forEach(function(t) {
          var pnl = getTradePnL(t);
          cumulative += pnl;
          pnlSeries.push(cumulative);
          if (cumulative > peak) peak = cumulative;
          var dd = peak - cumulative;
          if (dd > maxDrawdown) maxDrawdown = dd;

          if (pnl > 0) {
            grossProfit += pnl; winAmounts.push(pnl);
            curWinStreak++; curLossStreak = 0;
            if (curWinStreak > maxWinStreak) maxWinStreak = curWinStreak;
          } else if (pnl < 0) {
            grossLoss += Math.abs(pnl); lossAmounts.push(Math.abs(pnl));
            curLossStreak++; curWinStreak = 0;
            if (curLossStreak > maxLossStreak) maxLossStreak = curLossStreak;
          } else {
            curWinStreak = 0; curLossStreak = 0;
          }

          var instrumentKey = (t.instrument || 'Diğer');
          var symbolKey = (t.symbol || '—');
          var key = instrumentKey + ':' + symbolKey;
          
          if (!instrumentMap[key]) {
            instrumentMap[key] = { 
              instrument: instrumentKey, 
              symbol: symbolKey,
              trades: 0, 
              wins: 0, 
              pnl: 0,
              count: 0
            };
          }
          instrumentMap[key].trades++;
          instrumentMap[key].pnl += pnl;
          if (pnl > 0) instrumentMap[key].wins++;
          instrumentMap[key].count++;

          tradesDetail.push({
            trade_date: t.trade_date,
            instrument: t.instrument || '—',
            symbol: t.symbol || '—',
            direction: t.direction || '—',
            entry_price: t.entry_price,
            exit_price: t.exit_price,
            lot: t.lot,
            pnl: pnl
          });
        });

        var instrumentBreakdown = Object.keys(instrumentMap).map(function(k) {
          var d = instrumentMap[k];
          return {
            instrument: d.instrument,
            symbol: d.symbol,
            trades: d.trades,
            pnl: d.pnl,
            winRate: d.trades ? parseFloat(((d.wins / d.trades) * 100).toFixed(1)) : 0
          };
        }).sort(function(a, b) { return b.pnl - a.pnl; });

        var bestInstrument = instrumentBreakdown.length ? instrumentBreakdown[0] : null;
        var worstInstrument = instrumentBreakdown.length ? instrumentBreakdown[instrumentBreakdown.length - 1] : null;

        var profitFactor = grossLoss > 0 ? parseFloat((grossProfit / grossLoss).toFixed(2)) : (grossProfit > 0 ? null : 0);
        var avgWin = winAmounts.length ? grossProfit / winAmounts.length : 0;
        var avgLoss = lossAmounts.length ? grossLoss / lossAmounts.length : 0;
        var avgRR = avgLoss > 0 ? parseFloat((avgWin / avgLoss).toFixed(2)) : (avgWin > 0 ? null : 0);

        return { 
          totalTrades: total, 
          totalTradesWithOpen: strategyTrades.length,
          wins: wins, 
          losses: losses, 
          openTrades: openTrades, 
          totalPnL: totalPnL, 
          winRate: winRate,
          pnlSeries: pnlSeries, 
          longCount: longCount, 
          shortCount: shortCount,
          profitFactor: profitFactor,
          avgWin: avgWin,
          avgLoss: avgLoss,
          avgRR: avgRR,
          maxWinStreak: maxWinStreak,
          maxLossStreak: maxLossStreak,
          maxDrawdown: maxDrawdown,
          instrumentBreakdown: instrumentBreakdown,
          bestInstrument: bestInstrument,
          worstInstrument: worstInstrument,
          tradesDetail: tradesDetail
        };
      } catch(e) {
        return { 
          totalTrades: 0, totalTradesWithOpen: 0, wins: 0, losses: 0, openTrades: 0, totalPnL: 0, winRate: 0, 
          pnlSeries: [], longCount: 0, shortCount: 0, profitFactor: 0, avgWin: 0, avgLoss: 0, avgRR: 0,
          maxWinStreak: 0, maxLossStreak: 0, maxDrawdown: 0, instrumentBreakdown: [], bestInstrument: null,
          worstInstrument: null, tradesDetail: []
        };
      }
    }

    function formatCurrencyFixed(value) {
      var num = parseFloat(value) || 0;
      var currency = typeof getCurrencySymbol === 'function' ? getCurrencySymbol() : '$';
      var formatted = Math.abs(num).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (num < 0) {
        return '-' + currency + formatted;
      }
      return currency + formatted;
    }

    var formatCurrencySafe = (typeof formatCurrency === 'function') ? formatCurrency : formatCurrencyFixed;

    function fmtDate(dateStr) {
      try {
        var d = new Date(dateStr);
        return d.toLocaleDateString('tr-TR');
      } catch(e) { return dateStr || '—'; }
    }

rrentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>\n                <button class="sc-btn danger delete-strategy-btn" data-id="' + s.id + '" aria-label="' + i18n.t('trades.delete') + '"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>\n              </div>\n            </div>\n          </div>';

    // ============================================================
    // CSV / PDF EXPORT - GÜVENLİ
    // ============================================================
    function downloadBlob(content, filename, mimeType) {
      try {
        var blob = new Blob([content], { type: mimeType });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function() { URL.revokeObjectURL(url); }, 200);
      } catch(e) {}
    }

    function csvEscape(val) {
      var s = (val === null || val === undefined) ? '' : String(val);
      return '"' + s.replace(/"/g, '""') + '"';
    }

    function getCurrentLanguage() {
      try {
        if (typeof i18n !== 'undefined' && i18n.getCurrentLanguage) {
          return i18n.getCurrentLanguage();
        }
      } catch(e) {}
      return 'en';
    }

    function exportStrategyCSV(strategyId) {
      try {
        var s = strategiesList.find(function(x) { return x.id === strategyId; });
        var perf = getStrategyPerformance(strategyId);
        var rows = [['Tarih','Sembol','Enstrüman','Yön','Giriş','Çıkış','Lot','K/Z']];
        perf.tradesDetail.forEach(function(t) {
          rows.push([fmtDate(t.trade_date), sanitizeHTML(t.symbol), sanitizeHTML(t.instrument), sanitizeHTML(t.direction), t.entry_price, t.exit_price, t.lot, t.pnl.toFixed(2)]);
        });
        rows.push([]);
        var pfDisplay = (perf.profitFactor === null) ? 'Sonsuz' : perf.profitFactor;
        rows.push(['Özet']);
        rows.push(['Toplam İşlem', perf.totalTradesWithOpen]);
        rows.push(['Win Rate', perf.winRate + '%']);
        rows.push(['Toplam K/Z', perf.totalPnL.toFixed(2)]);
        rows.push(['Profit Factor', pfDisplay]);
        rows.push(['Maks. Drawdown', perf.maxDrawdown.toFixed(2)]);

        var csvContent = rows.map(function(r) { return r.map(csvEscape).join(','); }).join('\r\n');
        downloadBlob('\uFEFF' + csvContent, (s ? sanitizeHTML(s.name) : 'strateji') + '_islemler.csv', 'text/csv;charset=utf-8;');
        showToast('CSV indirildi');
      } catch(e) { showToast('CSV oluşturulamadı', 'error'); }
    }

    function exportAllStrategiesCSV() {
      try {
        var rows = [['Strateji','Toplam İşlem','Win Rate','Toplam K/Z','Profit Factor','Ort. R:R','Maks. Drawdown','En İyi Enstrüman']];
        strategiesList.forEach(function(s) {
          var perf = getStrategyPerformance(s.id);
          var bestInst = perf.bestInstrument ? (perf.bestInstrument.instrument + ' ' + perf.bestInstrument.symbol) : '—';
          rows.push([
            sanitizeHTML(s.name),
            perf.totalTradesWithOpen,
            perf.winRate + '%',
            perf.totalPnL.toFixed(2),
            perf.profitFactor === null ? 'Sonsuz' : perf.profitFactor,
            perf.avgRR === null ? 'Sonsuz' : perf.avgRR,
            perf.maxDrawdown.toFixed(2),
            sanitizeHTML(bestInst)
          ]);
        });
        var csvContent = rows.map(function(r) { return r.map(csvEscape).join(','); }).join('\r\n');
        downloadBlob('\uFEFF' + csvContent, 'strateji_ozeti.csv', 'text/csv;charset=utf-8;');
        showToast('CSV indirildi');
      } catch(e) { showToast('CSV oluşturulamadı', 'error'); }
    }

    function exportStrategyPDF(strategyId) {
      try {
        var lang = getCurrentLanguage();
        var s = strategiesList.find(function(x) { return x.id === strategyId; });
        var perf = getStrategyPerformance(strategyId);
        var jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
        if (!jsPDFCtor) { showToast('PDF kütüphanesi yüklenemedi', 'error'); return; }
        var doc = new jsPDFCtor();

        var title = (s ? sanitizeHTML(s.name) : 'Strategy') + ' - Performance Report';
        var createdLabel = 'Created: ';
        var tradesLabel = 'Total Trades', winRateLabel = 'Win Rate', pnlLabel = 'Total P&L';
        var pfLabel = 'Profit Factor', rrLabel = 'Avg R:R', ddLabel = 'Max Drawdown';
        var winStreakLabel = 'Max Win Streak', lossStreakLabel = 'Max Loss Streak';
        var bestInstLabel = 'Best Instrument';
        var dateLabel = 'Date', symbolLabel = 'Symbol', instrumentLabel = 'Instrument';
        var directionLabel = 'Direction', entryLabel = 'Entry', exitLabel = 'Exit';
        var lotLabel = 'Lot', pnlShortLabel = 'P&L';

        if (lang === 'tr') {
          title = (s ? sanitizeHTML(s.name) : 'Strateji') + ' - Performans Raporu';
          createdLabel = 'Oluşturulma: ';
          tradesLabel = 'Toplam İşlem'; winRateLabel = 'Win Rate'; pnlLabel = 'Toplam K/Z';
          pfLabel = 'Profit Factor'; rrLabel = 'Ort. R:R'; ddLabel = 'Maks. Drawdown';
          winStreakLabel = 'Maks. Kazanma Serisi'; lossStreakLabel = 'Maks. Kaybetme Serisi';
          bestInstLabel = 'En İyi Enstrüman';
          dateLabel = 'Tarih'; symbolLabel = 'Sembol'; instrumentLabel = 'Enstrüman';
          directionLabel = 'Yön'; entryLabel = 'Giriş'; exitLabel = 'Çıkış';
          lotLabel = 'Lot'; pnlShortLabel = 'K/Z';
        } else if (lang === 'de') {
          title = (s ? sanitizeHTML(s.name) : 'Strategie') + ' - Leistungsbericht';
          createdLabel = 'Erstellt: ';
          tradesLabel = 'Gesamt Trades'; winRateLabel = 'Win-Rate'; pnlLabel = 'Gesamt P&L';
          pfLabel = 'Profit Faktor'; rrLabel = 'Durch. R:R'; ddLabel = 'Max. Drawdown';
          winStreakLabel = 'Max. Gewinnserie'; lossStreakLabel = 'Max. Verlustserie';
          bestInstLabel = 'Bestes Instrument';
          dateLabel = 'Datum'; symbolLabel = 'Symbol'; instrumentLabel = 'Instrument';
          directionLabel = 'Richtung'; entryLabel = 'Einstieg'; exitLabel = 'Ausstieg';
          lotLabel = 'Lot'; pnlShortLabel = 'P&L';
        }

        doc.setFontSize(16);
        doc.text(title, 14, 18);
        doc.setFontSize(9);
        doc.setTextColor(120);
        doc.text(createdLabel + new Date().toLocaleDateString(lang === 'tr' ? 'tr-TR' : (lang === 'de' ? 'de-DE' : 'en-US')), 14, 24);
        doc.setTextColor(0);

        var pfDisplay = (perf.profitFactor === null) ? '∞' : String(perf.profitFactor);
        var rrDisplay = (perf.avgRR === null) ? '∞' : String(perf.avgRR);
        var bestInst = perf.bestInstrument ? (perf.bestInstrument.instrument + ' ' + perf.bestInstrument.symbol) : '—';

        var summaryLines = [
          [tradesLabel, String(perf.totalTradesWithOpen)],
          [winRateLabel, perf.winRate + '%'],
          [pnlLabel, perf.totalPnL.toFixed(2)],
          [pfLabel, pfDisplay],
          [rrLabel, rrDisplay],
          [ddLabel, perf.maxDrawdown.toFixed(2)],
          [winStreakLabel, String(perf.maxWinStreak)],
          [lossStreakLabel, String(perf.maxLossStreak)],
          [bestInstLabel, sanitizeHTML(bestInst)]
        ];

        var y = 34;
        doc.setFontSize(10);
        summaryLines.forEach(function(line) {
          doc.text(line[0] + ':', 14, y);
          doc.text(line[1], 80, y);
          y += 6.5;
        });

        if (doc.autoTable) {
          var body = perf.tradesDetail.map(function(t) {
            return [fmtDate(t.trade_date), sanitizeHTML(t.symbol), sanitizeHTML(t.instrument), sanitizeHTML(t.direction), String(t.entry_price != null ? t.entry_price : '-'), String(t.exit_price != null ? t.exit_price : '-'), String(t.lot != null ? t.lot : '-'), t.pnl.toFixed(2)];
          });
          doc.autoTable({
            startY: y + 4,
            head: [[dateLabel, symbolLabel, instrumentLabel, directionLabel, entryLabel, exitLabel, lotLabel, pnlShortLabel]],
            body: body,
            styles: { fontSize: 8, cellPadding: 2 },
            headStyles: { fillColor: [139, 92, 246] },
            margin: { left: 14, right: 14 }
          });
        }

        doc.save((s ? sanitizeHTML(s.name) : 'strateji') + '_rapor.pdf');
        showToast('PDF indirildi');
      } catch(e) { showToast('PDF oluşturulamadı', 'error'); }
    }

    function exportAllStrategiesPDF() {
      try {
        var lang = getCurrentLanguage();
        var jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
        if (!jsPDFCtor) { showToast('PDF kütüphanesi yüklenemedi', 'error'); return; }
        var doc = new jsPDFCtor();

        var title = 'Strategy Performance Summary';
        var createdLabel = 'Created: ';
        if (lang === 'tr') {
          title = 'Strateji Performans Özeti';
          createdLabel = 'Oluşturulma: ';
        } else if (lang === 'de') {
          title = 'Strategie-Leistungsübersicht';
          createdLabel = 'Erstellt: ';
        }

        doc.setFontSize(16);
        doc.text(title, 14, 18);
        doc.setFontSize(9);
        doc.setTextColor(120);
        doc.text(createdLabel + new Date().toLocaleDateString(lang === 'tr' ? 'tr-TR' : (lang === 'de' ? 'de-DE' : 'en-US')), 14, 24);
        doc.setTextColor(0);

        var body = strategiesList.map(function(s) {
          var perf = getStrategyPerformance(s.id);
          var bestInst = perf.bestInstrument ? (perf.bestInstrument.instrument + ' ' + perf.bestInstrument.symbol) : '—';
          return [
            sanitizeHTML(s.name),
            String(perf.totalTradesWithOpen),
            perf.winRate + '%',
            perf.totalPnL.toFixed(2),
            perf.profitFactor === null ? '∞' : String(perf.profitFactor),
            perf.maxDrawdown.toFixed(2),
            sanitizeHTML(bestInst)
          ];
        });

        if (doc.autoTable) {
          var headers = ['Strategy','Trades','Win Rate','Total P&L','Profit Factor','Max Drawdown','Best Instrument'];
          if (lang === 'tr') {
            headers = ['Strateji','İşlem','Win Rate','Toplam K/Z','Profit Factor','Maks. Drawdown','En İyi Enstrüman'];
          } else if (lang === 'de') {
            headers = ['Strategie','Trades','Win-Rate','Gesamt P&L','Profit Faktor','Max. Drawdown','Bestes Instrument'];
          }
          doc.autoTable({
            startY: 30,
            head: [headers],
            body: body,
            styles: { fontSize: 8, cellPadding: 2 },
            headStyles: { fillColor: [139, 92, 246] },
            margin: { left: 14, right: 14 }
          });
        }

        var filename = 'strateji_ozeti.pdf';
        if (lang === 'tr') filename = 'strateji_ozeti.pdf';
        else if (lang === 'de') filename = 'strategie_zusammenfassung.pdf';
        else filename = 'strategy_summary.pdf';
        doc.save(filename);
        showToast('PDF indirildi');
      } catch(e) { showToast('PDF oluşturulamadı', 'error'); }
    }

    function setupExportButtons() {
      var csvBtn = document.getElementById('export-all-csv');
      if (csvBtn) csvBtn.addEventListener('click', exportAllStrategiesCSV);
      var pdfBtn = document.getElementById('export-all-pdf');
      if (pdfBtn) pdfBtn.addEventListener('click', exportAllStrategiesPDF);
    }

    var addModal = document.getElementById('add-strategy-modal');
    var editModal = document.getElementById('edit-strategy-modal');

    var openAddBtn = document.getElementById('open-add-strategy-modal');
    if (openAddBtn) {
      openAddBtn.addEventListener('click', function() {
        var nameEl = document.getElementById('new-strategy-name');
        var descEl = document.getElementById('new-strategy-desc');
        var colorEl = document.getElementById('new-strategy-color');
        if (nameEl) nameEl.value = '';
        if (descEl) descEl.value = '';
        if (colorEl) colorEl.value = '#8b5cf6';
        if (addModal) addModal.style.display = 'flex';
      });
    }

    var closeAddIds = ['close-add-modal', 'cancel-add-strategy'];
    closeAddIds.forEach(function(id) {
      var el = document.getElementById(id);
      if (el) {
        el.addEventListener('click', function() { 
          if (addModal) addModal.style.display = 'none'; 
        });
      }
    });
    
    var closeEditIds = ['close-edit-modal', 'cancel-edit-strategy'];
    closeEditIds.forEach(function(id) {
      var el = document.getElementById(id);
      if (el) {
        el.addEventListener('click', function() { 
          if (editModal) editModal.style.display = 'none'; 
        });
      }
    });

    if (addModal) {
      addModal.addEventListener('click', function(e) { 
        if (e.target === addModal) addModal.style.display = 'none'; 
      });
    }
    
    if (editModal) {
      editModal.addEventListener('click', function(e) { 
        if (e.target === editModal) editModal.style.display = 'none'; 
      });
    }

    var confirmAddBtn = document.getElementById('confirm-add-strategy');
    if (confirmAddBtn) {
      confirmAddBtn.addEventListener('click', async function() {
        var nameEl = document.getElementById('new-strategy-name');
        var descEl = document.getElementById('new-strategy-desc');
        var colorEl = document.getElementById('new-strategy-color');
        var name = nameEl ? nameEl.value.trim() : '';
        var desc = descEl ? descEl.value.trim() : '';
        var color = colorEl ? colorEl.value : '#8b5cf6';
        if (!name) { 
          showToast(i18n.t('strategies.error_name_required'), 'error'); 
          return; 
        }
        var result = await addStrategy(name, desc, color);
        if (result) { 
          if (addModal) addModal.style.display = 'none'; 
          await loadAllData(); 
        }
      });
    }

    var confirmEditBtn = document.getElementById('confirm-edit-strategy');
    if (confirmEditBtn) {
      confirmEditBtn.addEventListener('click', async function() {
        var idEl = document.getElementById('edit-strategy-id');
        var nameEl = document.getElementById('edit-strategy-name');
        var descEl = document.getElementById('edit-strategy-desc');
        var colorEl = document.getElementById('edit-strategy-color');
        var id = idEl ? idEl.value : '';
        var name = nameEl ? nameEl.value.trim() : '';
        var desc = descEl ? descEl.value.trim() : '';
        var color = colorEl ? colorEl.value : '#8b5cf6';
        if (!name) { 
          showToast(i18n.t('strategies.error_name_required'), 'error'); 
          return; 
        }
        try {
          var { error } = await sb.from('strategies').update({ 
            name: sanitizeHTML(name), 
            description: sanitizeHTML(desc || null), 
            color: sanitizeHTML(color) 
          }).eq('id', id);
          if (error) { 
            showToast(i18n.t('strategies.error_update') + error.message, 'error'); 
            return; 
          }
          showToast(i18n.t('strategies.updated'));
          if (editModal) editModal.style.display = 'none';
          await loadAllData();
        } catch(e) {}
      });
    }
  </script>
</body>
</html>
