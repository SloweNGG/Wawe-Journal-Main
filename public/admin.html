<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title data-i18n="nav.admin">Admin Panel – Wawe Journal</title>
  <link rel="icon" type="image/svg+xml" href="resim.svg">
  
  <!-- ⭐ NAVBAR CSS -->
  <link rel="stylesheet" href="/components/navbar.css" />
  
  <!-- ⭐ LUCIDE ICONS -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
  (function() {
    if (document.body) {
      var savedTheme = localStorage.getItem('ww_theme');
      if (savedTheme === 'light') {
        document.body.classList.add('light-theme');
      } else {
        document.body.classList.remove('light-theme');
      }
    } else {
      document.addEventListener('DOMContentLoaded', function() {
        var savedTheme = localStorage.getItem('ww_theme');
        if (savedTheme === 'light') {
          document.body.classList.add('light-theme');
        } else {
          document.body.classList.remove('light-theme');
        }
      });
    }
  })();
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    .admin-main {
      padding: 0.9rem 2rem;
      max-width: 100%;
      margin: 0 auto;
      width: 100%;
    }

    /* ============================================================
       ADMIN WRAP - AYARLAR SAYFASI GİBİ
       ============================================================ */
    .admin-wrap {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 1.25rem;
      align-items: start;
    }
    .admin-sidebar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: sticky;
      top: 80px;
    }
    .admin-sidebar .sidebar-header {
      padding: 1.25rem 1rem;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .admin-sidebar .sidebar-header .sidebar-avatar {
      width: 56px;
      height: 56px;
      background: var(--surface2);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 0.65rem;
      overflow: hidden;
      border: 2px solid var(--border);
    }
    .admin-sidebar .sidebar-header .sidebar-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .admin-sidebar .sidebar-header .sidebar-avatar .no-avatar {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      background: var(--surface2);
    }
    .admin-sidebar .sidebar-header .sidebar-username {
      font-family: 'Syne', sans-serif;
      font-size: .9rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: .15rem;
    }
    .admin-sidebar .sidebar-header .sidebar-email {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      word-break: break-all;
    }
    .admin-sidebar .sidebar-nav {
      padding: .5rem;
    }
    .admin-sidebar .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: .65rem;
      padding: .6rem .85rem;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: all .2s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .admin-sidebar .sidebar-nav-item .nav-icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.8;
      flex-shrink: 0;
    }
    .admin-sidebar .sidebar-nav-item:hover {
      background: rgba(139,92,246,0.07);
      color: var(--text);
    }
    .admin-sidebar .sidebar-nav-item.active {
      background: rgba(139,92,246,0.12);
      color: var(--accent2);
    }
    .admin-sidebar .sidebar-nav-divider {
      height: 1px;
      background: var(--border);
      margin: .4rem .85rem;
    }

    /* ============================================================
       ADMIN PANELS
       ============================================================ */
    .admin-panels {
      position: relative;
      min-width: 0;
    }
    .panel-glow {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 280px;
      border-radius: var(--radius) var(--radius) 0 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.7;
      transition: all 0.3s ease;
    }
    .panel-glow.users-glow {
      background: radial-gradient(ellipse 70% 30% at 50% 0%, rgba(139,92,246,0.5), transparent 70%);
      animation: glowPulse 3s ease-in-out infinite;
    }
    .panel-glow.references-glow {
      background: radial-gradient(ellipse 70% 30% at 50% 0%, rgba(34,197,94,0.45), transparent 70%);
      animation: glowPulse 3s ease-in-out infinite;
    }
    .panel-glow.analytics-glow {
      background: radial-gradient(ellipse 70% 30% at 50% 0%, rgba(139,92,246,0.5), transparent 70%);
      animation: glowPulse 3s ease-in-out infinite;
    }
    .panel-glow.prices-glow {
      background: radial-gradient(ellipse 70% 30% at 50% 0%, rgba(139,92,246,0.6), transparent 70%);
      animation: glowPulse 3s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    body.light-theme .panel-glow.users-glow {
      background: radial-gradient(ellipse 70% 30% at 50% 0%, rgba(139,92,246,0.25), transparent 70%);
    }
    body.light-theme .panel-glow.references-glow {
      background: radial-gradient(ellipse 70% 30% at 50% 0%, rgba(34,197,94,0.2), transparent 70%);
    }
    body.light-theme .panel-glow.analytics-glow {
      background: radial-gradient(ellipse 70% 30% at 50% 0%, rgba(139,92,246,0.25), transparent 70%);
    }
    body.light-theme .panel-glow.prices-glow {
      background: radial-gradient(ellipse 70% 30% at 50% 0%, rgba(139,92,246,0.25), transparent 70%);
    }

    .admin-panel {
      display: none;
      position: relative;
      z-index: 1;
      background: transparent;
    }
    .admin-panel.active {
      display: block;
      animation: panelFadeIn 0.3s ease;
    }
    @keyframes panelFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       S-CARD (Settings Card)
       ============================================================ */
    .s-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 1rem;
      backdrop-filter: blur(2px);
    }
    .s-card-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: .65rem;
    }
    .s-card-header .header-icon {
      width: 32px;
      height: 32px;
      background: rgba(139,92,246,0.08);
      border: 1px solid rgba(139,92,246,0.15);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .s-card-header .header-icon svg {
      width: 16px;
      height: 16px;
      stroke: var(--accent2);
      stroke-width: 1.8;
    }
    .s-card-header h2 {
      font-family: 'Syne', sans-serif;
      font-size: .9rem;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }
    .s-card-header p {
      font-size: 11px;
      color: var(--muted);
      margin: .1rem 0 0;
    }
    .s-card-body { padding: 1.1rem 1.25rem; }

    /* ============================================================
       MOBILE TABS
       ============================================================ */
    .admin-tabs-mobile {
      display: none;
      gap: .4rem;
      overflow-x: auto;
      margin-bottom: 1rem;
    }
    .admin-tab-btn {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .45rem .85rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .admin-tab-btn .tab-icon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 1.8;
      flex-shrink: 0;
    }
    .admin-tab-btn.active {
      background: rgba(139,92,246,0.1);
      border-color: rgba(139,92,246,0.3);
      color: var(--accent2);
    }

    /* ============================================================
       PAGE HEADER
       ============================================================ */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .page-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.2rem;
      background: linear-gradient(135deg, var(--text) 0%, var(--accent2) 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .page-header .subtitle {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 0;
    }
    .admin-badge {
      background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(167,139,250,0.1));
      border: 1px solid rgba(139,92,246,0.3);
      color: var(--accent2);
      padding: 0.35rem 1rem;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      font-family: 'DM Mono', monospace;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .header-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    /* ============================================================
       TABLO STİLLERİ
       ============================================================ */
    .ww-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .ww-table thead {
      border-bottom: 1px solid var(--border);
    }
    .ww-table th {
      padding: 0.65rem 0.9rem;
      text-align: left;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      font-family: 'DM Mono', monospace;
    }
    .ww-table td {
      padding: 0.7rem 0.9rem;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: middle;
      line-height: 1.5;
      font-size: 12.5px;
      font-family: 'DM Sans', sans-serif;
    }
    .ww-table tr:last-child td { border-bottom: none; }
    .ww-table tbody tr:hover { background: rgba(139,92,246,0.04); }

    /* ============================================================
       STATS GRID
       ============================================================ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      transition: all 0.2s ease;
    }
    .stat-card:hover {
      border-color: rgba(139,92,246,0.25);
    }
    .stat-card .stat-label {
      font-size: 9px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .stat-card .stat-value {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
    }
    .stat-card .stat-value.green { color: var(--green); }
    .stat-card .stat-value.red { color: var(--red); }
    .stat-card .stat-value.accent { color: var(--accent2); }
    .stat-card .stat-sub {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ============================================================
       PLAN BADGE (Kullanıcı Listesi)
       ============================================================ */
    .plan-badge-user {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0.15rem 0.6rem;
      border-radius: 20px;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .plan-badge-user.free {
      background: rgba(107,107,128,0.1);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .plan-badge-user.premium {
      background: rgba(139,92,246,0.15);
      color: var(--accent2);
      border: 1px solid rgba(139,92,246,0.25);
    }
    .plan-badge-user .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      display: inline-block;
    }
    .plan-badge-user.premium .dot {
      background: var(--accent2);
      box-shadow: 0 0 6px rgba(139,92,246,0.4);
      animation: dotPulse 2s ease-in-out infinite;
    }
    .plan-badge-user.free .dot {
      background: var(--muted);
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }

    .expiry-text {
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
    }
    .expiry-text.soon {
      color: #f59e0b;
    }
    .expiry-text.expired {
      color: var(--red);
    }

    /* ============================================================
       PRICE CARDS
       ============================================================ */
    .price-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .price-card .price-title {
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.5rem;
    }
    .price-card .price-desc {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    .price-input-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .price-input-group label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      min-width: 60px;
    }
    .price-input-group input[type="number"] {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      width: 100px;
      outline: none;
      transition: border-color 0.2s;
    }
    .price-input-group input[type="number"]:focus {
      border-color: var(--accent);
    }
    .price-input-group .currency-label {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: var(--muted);
    }
    .payment-methods-grid {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .payment-method-chip {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.3rem 0.8rem;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text);
    }
    .payment-method-chip .remove-method {
      cursor: pointer;
      color: var(--muted);
      transition: color 0.2s;
      background: none;
      border: none;
      font-size: 12px;
    }
    .payment-method-chip .remove-method:hover {
      color: var(--red);
    }
    .add-method-input {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .add-method-input input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem 0.65rem;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      width: 70px;
      outline: none;
      text-transform: uppercase;
    }
    .add-method-input input:focus {
      border-color: var(--accent);
    }
    .add-method-input button {
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #fff;
      padding: 0.3rem 0.6rem;
      font-size: 11px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .add-method-input button:hover { opacity: 0.85; }
    .price-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.25rem;
      flex-wrap: wrap;
    }

    /* ============================================================
       CHARTS
       ============================================================ */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .charts-grid-full {
      grid-column: 1 / -1;
    }
    @media (max-width: 768px) { 
      .charts-grid { grid-template-columns: 1fr; }
      .charts-grid-full { grid-column: 1; }
    }

    /* ============================================================
       SEARCH
       ============================================================ */
    .search-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .search-wrap svg {
      position: absolute;
      left: 12px;
      color: var(--muted);
    }
    .search-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 0.45rem 1rem 0.45rem 2.25rem;
      color: var(--text);
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      width: 200px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .search-input::placeholder { color: var(--muted); }

    .id-chip {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 4px;
    }
    .role-badge {
      display: inline-block;
      padding: 0.2rem 0.65rem;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      font-family: 'DM Mono', monospace;
    }
    .role-admin { background: rgba(139,92,246,0.15); color: var(--accent2); border: 1px solid rgba(139,92,246,0.25); }
    .role-user { background: rgba(107,107,128,0.1); color: var(--muted); border: 1px solid var(--border); }
    .status-online {
      display: inline-flex; align-items: center; gap: 5px;
      color: var(--green); font-size: 11px; font-weight: 500;
    }
    .status-online::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green-glow);
      animation: pulse 2s infinite;
    }
    .status-offline {
      display: inline-flex; align-items: center; gap: 5px;
      color: var(--muted); font-size: 11px;
    }
    .status-offline::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .ref-social-icons { font-size: 15px; letter-spacing: 3px; }

    .recent-premium-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      background: var(--surface2);
      border-radius: 10px;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }
    .recent-premium-card:hover {
      border-color: rgba(139,92,246,0.3);
      background: rgba(139,92,246,0.03);
    }
    .recent-premium-card .avatar-small {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--border);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: var(--muted);
      font-family: 'Syne', sans-serif;
    }
    .recent-premium-card .avatar-small img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .recent-premium-card .info {
      flex: 1;
    }
    .recent-premium-card .info .name {
      font-weight: 600;
      color: var(--text);
      font-size: 13px;
    }
    .recent-premium-card .info .email {
      font-size: 11px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }
    .recent-premium-card .info .plan-type {
      font-size: 10px;
      font-weight: 600;
      font-family: 'DM Mono', monospace;
      color: var(--accent2);
      background: rgba(139,92,246,0.1);
      padding: 0.1rem 0.5rem;
      border-radius: 12px;
      border: 1px solid rgba(139,92,246,0.15);
    }
    .recent-premium-card .amount {
      font-family: 'DM Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      color: var(--green);
    }

    .toast-container {
      position: fixed;
      bottom: 1.5rem; right: 1.5rem;
      z-index: 9999;
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .toast {
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius);
      font-size: 13px;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      animation: toastIn 0.3s ease;
      max-width: 320px;
      font-family: 'DM Sans', sans-serif;
    }
    .toast.success { border-left: 3px solid var(--green); }
    .toast.success::before { content: '✓'; color: var(--green); font-weight: 700; }
    .toast.error { border-left: 3px solid var(--red); }
    .toast.error::before { content: '!'; color: var(--red); font-weight: 700; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .spinner {
      width: 22px; height: 22px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============================================================
       MOBIL RESPONSIVE
       ============================================================ */
    @media (max-width: 767px) {
      .admin-tabs-mobile { display: flex; }
      .admin-wrap { grid-template-columns: 1fr; }
      .admin-sidebar { display: none; }
      .admin-main { padding: 0.9rem 1rem; }
      .page-header { flex-direction: column; gap: 0.75rem; }
    }

    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .charts-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .search-input { width: 100%; }
      .header-actions { width: 100%; }
      .header-actions .search-wrap { width: 100%; }
      .header-actions .search-input { width: 100%; }
      .price-input-group { flex-direction: column; align-items: stretch; }
      .price-input-group input[type="number"] { width: 100%; }
    }

    /* ============================================================
       MODAL
       ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      z-index: 400;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 16px;
      max-width: 560px;
      width: 100%;
      max-height: 90vh;

      from { opacity: 0; transform: scale(0.96) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.1rem 1.35rem;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin: 0;
      letter-spacing: -0.02em;
    }
    .modal-close {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      transition: all 0.2s;
    }
    .modal-close:hover { background: var(--red); color: #fff; border-color: var(--red); }
    .modal-body { padding: 1.25rem 1.35rem; }
    .modal-footer {
      display: flex; gap: 0.75rem; justify-content: flex-end;
      padding: 1rem 1.35rem 1.25rem;
      border-top: 1px solid var(--border);
    }
    .field { margin-bottom: 0.75rem; }
    .field label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
      color: var(--text);

    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .field select option { background: var(--surface2); }
    .field textarea { resize: vertical; min-height: 70px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 480px) { .field-row { grid-template-columns: 1fr; } }
    .section-divider {

    async function updatePlanBadge() {
      var badge = document.querySelector('.plan-badge');

      if (!badge || !text) return;
      
      try {
        var planData = await getUserPlan();
        var isPremium = planData.plan === 'premium';
        
        if (isPremium) {
          badge.classList.add('premium');
          text.textContent = 'Premium';
        } else {
          badge.classList.remove('premium');
          text.textContent = 'Ücretsiz';
        }
      } catch (e) {
        // Sessizce geç
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(updatePlanBadge, 500);
    });

    i18n.onChange(function() {
      updatePlanBadge();
    });

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(msg, type) {
      type = type || 'success';
      try {
        var tc = document.getElementById('toast-container');
        if (!tc) return;
        var el = document.createElement('div');
        el.className = 'toast ' + type;
        el.textContent = msg;
        tc.appendChild(el);
        setTimeout(function() { 
          if (el && el.parentNode) el.remove(); 
        }, 3500);
      } catch (e) {
        // Sessizce geç
      }
    }

    // ============================================================
    // DATE FORMAT
    // ============================================================
    function formatDate(iso) {
      if (!iso) return '—';
      try {
        var d = new Date(iso);
        return d.toLocaleDateString('tr-TR', { day: '2-digit', month: 'short', year: 'numeric' });
      } catch(e) {
        return '—';
      }
    }

    function formatDateFull(iso) {
      if (!iso) return '—';
      try {
        var d = new Date(iso);
        return d.toLocaleDateString('tr-TR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      } catch(e) {
        return '—';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"]/g, function(m) {
        var map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
        return map[m] || m;
      });
    }

    function getInitials(name) {
      if (!name) return '?';
      return name.charAt(0).toUpperCase();
    }

    // ============================================================
    // LOAD FUNCTIONS
    // ============================================================
    async function loadUsers() {
      try {
        var { data: profiles, error } = await sb
          .from('user_profiles').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        usersList = (profiles || []).map(function(p) {
          return {
            id: p.id,
            email: p.email || '—',
            username: p.username || '—',
            user_metadata: { username: p.username || '—', role: p.role || 'user' },
            plan: p.plan || 'free',
            plan_expires_at: p.plan_expires_at || null,
            created_at: p.created_at,
            last_active: p.last_active,
            avatar_url: p.avatar_url || null
          };
        });
      } catch (e) {
        showToast('Kullanıcılar yüklenemedi!', 'error');
        usersList = [];
      }
    }

    async function loadReferences() {
      try {
        var { data, error } = await sb.from('references').select('*').order('display_order', { ascending: true });
        if (!error) references = data || [];
      } catch (e) {
        references = [];
      }
    }

    function filterUsers(term) {
      if (!term) return usersList;
      var t = term.toLowerCase();
      return usersList.filter(function(u) {
        return (u.email || '').toLowerCase().indexOf(t) !== -1 ||
          (u.id || '').toLowerCase().indexOf(t) !== -1 ||
          (u.username || '').toLowerCase().indexOf(t) !== -1;
      });
    }

    // ⭐ Premium kullanıcıları filtreleme özelliği
    function filterPremiumUsers(users) {
      return users.filter(function(u) {
        return u.plan === 'premium' && u.plan_expires_at && new Date(u.plan_expires_at) > new Date();
      });
    }

      var targetPanel = document.getElementById(panelId);
      if (targetPanel) targetPanel.classList.add('active');
      
      var sidebarItems = document.querySelectorAll('.sidebar-nav-item');
      sidebarItems.forEach(function(b) {
        b.classList.toggle('active', b.dataset.panel === panelId);
      });
      
      var tabItems = document.querySelectorAll('.admin-tab-btn');
      tabItems.forEach(function(b) {
        b.classList.toggle('active', b.dataset.panel === panelId);
      });
      
      var glow = document.getElementById('panel-glow');
      if (glow) {
        glow.className = 'panel-glow';
        if (panelId === 'panel-users') glow.classList.add('users-glow');
        else if (panelId === 'panel-references') glow.classList.add('references-glow');
        else if (panelId === 'panel-analytics') glow.classList.add('analytics-glow');
        else if (panelId === 'panel-prices') glow.classList.add('prices-glow');

      if (panelId === 'panel-references') renderReferencesTable();
      if (panelId === 'panel-analytics') loadAnalyticsData();
      if (panelId === 'panel-prices') renderPricesContent();

    // ============================================================
    // USERS TABLE - Premium süresi gösterimi düzeltildi
    // ============================================================
    async function renderUsersTable() {
      var container = document.getElementById('users-table-container');
      if (!container) return;
      
      var term = '';
      var searchInput = document.getElementById('user-search');
      if (searchInput) term = searchInput.value || '';
      
      var filtered = filterUsers(term);
      var countEl = document.getElementById('user-count');
      if (countEl) countEl.textContent = filtered.length;

      try {
        var { data: trades } = await sb.from('trades').select('user_id');
        var tradeCounts = {};
        (trades || []).forEach(function(t) { 
          tradeCounts[t.user_id] = (tradeCounts[t.user_id] || 0) + 1; 
        });
      } catch(e) {
        var tradeCounts = {};
      }

      var now = new Date();
      var AW = 10 * 60 * 1000;

      var rows = filtered.map(function(u) {
        var online = u.last_active && (now - new Date(u.last_active)) < AW;
        var role = (u.user_metadata && u.user_metadata.role) || 'user';
        var tc = tradeCounts[u.id] || 0;
        var isPremium = u.plan === 'premium';
        var expiresAt = u.plan_expires_at ? new Date(u.plan_expires_at) : null;
        var isExpired = isPremium && expiresAt && new Date() > expiresAt;
        
        var expiryText = '—';
        var expiryClass = '';
        if (isPremium && expiresAt) {
          if (isExpired) {
            expiryText = '⏳ Süresi Doldu';
            expiryClass = 'expired';
          } else {
            var daysLeft = Math.ceil((expiresAt - now) / (1000 * 60 * 60 * 24));
            expiryText = daysLeft + ' gün';
            if (daysLeft < 3) expiryClass = 'soon';
          }
        }
        
        var avatarHtml = u.avatar_url 
          ? '<img src="' + u.avatar_url + '" alt="avatar" style="width:28px;height:28px;border-radius:50%;object-fit:cover;">'
          : '<span style="font-size:11px;font-weight:700;">' + getInitials(u.username) + '</span>';
        
        return '<tr>\n          <td><span class="id-chip">' + (u.id || '').slice(0, 8) + '…</span></td>\n          <td>\n            <div style="display:flex;align-items:center;gap:8px;">\n              <div style="width:28px;height:28px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;">\n                ' + avatarHtml + '\n              </div>\n              <span style="font-weight:500;">' + escapeHtml(u.username || '—') + '</span>\n            </div>\n          </td>\n          <td style="color:var(--muted);font-size:12px;">' + escapeHtml(u.email || '—') + '</td>\n          <td>\n            <span class="plan-badge-user ' + (isPremium && !isExpired ? 'premium' : 'free') + '">\n              <span class="dot"></span>\n              ' + (isPremium && !isExpired ? 'Premium' : 'Free') + '\n            </span>\n          </td>\n          <td style="font-size:11px;font-family:\'DM Mono\',monospace;">\n            ' + (isPremium && !isExpired 
              ? '<span class="expiry-text ' + expiryClass + '">' + expiryText + '</span>'
              : '<span class="expiry-text">' + expiryText + '</span>') + '\n          </td>\n          <td style="font-size:12px;color:var(--muted);">\n            ' + (isPremium && expiresAt && !isExpired ? formatDate(expiresAt) : '—') + '\n          </td>\n          <td style="font-size:12px;color:var(--muted);">' + formatDate(u.created_at) + '</td>\n          <td>' + (online ? '<span class="status-online">Aktif</span>' : '<span class="status-offline">Çevrimdışı</span>') + '</td>\n          <td><span class="role-badge role-' + role + '">' + (role === 'admin' ? 'Admin' : 'User') + '</span></td>\n        </tr>';
      }).join('');

      container.innerHTML = '\n        <div class="table-wrap" style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;">\n          <div style="overflow-x:auto;">\n            <table class="ww-table">\n              <thead>\n                <tr><th>ID</th><th>Kullanıcı</th><th>E-posta</th><th>Plan</th><th>Kalan Süre</th><th>Bitiş Tarihi</th><th>Kayıt</th><th>Durum</th><th>Rol</th></tr>\n              </thead>\n              <tbody>\n                ' + (rows || '<tr><td colspan="9"><div style="text-align:center;padding:3rem 1rem;color:var(--muted);font-size:14px;">Kullanıcı bulunamadı.</div></td></tr>') + '\n              </tbody>\n            </table>\n          </div>\n        </div>\n      ';
    }

    function addPaymentMethod() {
      var input = document.getElementById('new-method-input');
      if (!input) return;
      var method = input.value.trim().toUpperCase();
      if (!method) {
        showToast('Lütfen bir kripto para birimi girin (örn: ETH)', 'error');
        return;
      }
      
      var methods = [];
      var chips = document.querySelectorAll('.payment-method-chip');
      chips.forEach(function(chip) {
        var text = chip.textContent.trim().replace('✕', '').trim();
        if (text) methods.push(text);
      });
      
      if (methods.indexOf(method) !== -1) {
        showToast('Bu ödeme metodu zaten ekli!', 'error');
        return;
      }
      
      methods.push(method);
      if (window.setPaymentMethods) window.setPaymentMethods(methods);
      renderPricesContent();
      showToast('✅ ' + method + ' eklendi!', 'success');
    }

    function removePaymentMethod(method) {
      var methods = [];
      var chips = document.querySelectorAll('.payment-method-chip');
      chips.forEach(function(chip) {
        var text = chip.textContent.trim().replace('✕', '').trim();
        if (text && text !== method) methods.push(text);
      });
      
      if (methods.length === 0) {
        showToast('En az bir ödeme metodu olmalıdır!', 'error');
        return;
      }
      
      if (window.setPaymentMethods) window.setPaymentMethods(methods);
      renderPricesContent();
      showToast('🗑️ ' + method + ' kaldırıldı.', 'success');
    }

    async function loadAnalyticsData() {
      try {
        var today = new Date().toISOString().split('T')[0];
        var last7 = [];
        for (var i = 6; i >= 0; i--) {
          var d = new Date();
          d.setDate(d.getDate() - i);
          last7.push(d.toISOString().split('T')[0]);
        }

        var { data: profiles } = await sb.from('user_profiles').select('*');
        var { data: trades } = await sb.from('trades').select('id, created_at');

        var profileList = profiles || [];
        var tradeList = trades || [];

        // ⭐ Premium kullanıcılar - süresi dolmamış olanlar
        var premiumUsers = profileList.filter(function(p) { 
          return p.plan === 'premium' && p.plan_expires_at && new Date(p.plan_expires_at) > new Date(); 
        });
        var totalPremium = premiumUsers.length;
        
        // ⭐ Toplam premium gelir - DOĞRU HESAPLAMA
        var totalRevenue = 0;
        var revenue7Days = 0;
        var revenueByDay = {};
        var recentPremiumUsers = [];

        profileList.forEach(function(p) {
          if (p.plan === 'premium' && p.plan_expires_at) {
            var expiresAt = new Date(p.plan_expires_at);
            var startDate = new Date(expiresAt);
            startDate.setDate(startDate.getDate() - 30);
            
            var diffDays = Math.ceil((expiresAt - startDate) / (1000 * 60 * 60 * 24));
            var isYearly = diffDays > 31;
            var price = isYearly ? 79 : 9;
            
            totalRevenue += price;
            
            var dayKey = startDate.toISOString().split('T')[0];
            if (!revenueByDay[dayKey]) revenueByDay[dayKey] = 0;
            revenueByDay[dayKey] += price;
            
            var sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
            if (startDate >= sevenDaysAgo) {
              revenue7Days += price;
              recentPremiumUsers.push({
                username: p.username || p.email || 'İsimsiz',
                email: p.email || '—',
                plan: isYearly ? 'Yıllık' : 'Aylık',
                amount: price,
                date: startDate,
                avatar_url: p.avatar_url || null
              });
            }
          }
        });

        var revenueData = last7.map(function(d) { return revenueByDay[d] || 0; });
        var uCounts = last7.map(function(d) { 
          return profileList.filter(function(p) { return p.created_at && p.created_at.split('T')[0] === d; }).length; 
        });
        var premium7Days = recentPremiumUsers.length;

        // ⭐ İstatistikleri güncelle
        var statsEls = {
          'stat-total-users': profileList.length,
          'stat-total-premium': totalPremium,
          'stat-premium-revenue': '$' + totalRevenue.toFixed(2),
          'stat-premium-7days': premium7Days
        };
        Object.keys(statsEls).forEach(function(id) {
          var el = document.getElementById(id);
          if (el) el.textContent = statsEls[id];
        });

        var recentContainer = document.getElementById('recent-premium-list');
        if (recentContainer) {
          if (recentPremiumUsers.length === 0) {
            recentContainer.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--muted);font-size:13px;">Henüz premium satışı yok.</div>';
          } else {
            recentContainer.innerHTML = recentPremiumUsers.sort(function(a, b) { return b.date - a.date; }).slice(0, 10).map(function(u) {
              var avatarHtml = u.avatar_url 
                ? '<img src="' + u.avatar_url + '" alt="avatar" style="width:100%;height:100%;object-fit:cover;">'
                : '<span style="font-weight:700;font-size:14px;">' + getInitials(u.username) + '</span>';
              
              return '\n              <div class="recent-premium-card">\n                <div class="avatar-small">' + avatarHtml + '</div>\n                <div class="info">\n                  <div class="name">' + escapeHtml(u.username) + '</div>\n                  <div class="email">' + escapeHtml(u.email) + '</div>\n                  <div style="display:flex;align-items:center;gap:0.5rem;margin-top:2px;">\n                    <span class="plan-type">' + u.plan + '</span>\n                    <span style="font-size:10px;color:var(--muted);font-family:\'DM Mono\',monospace;">' + formatDateFull(u.date) + '</span>\n                  </div>\n                </div>\n                <div class="amount">+$' + u.amount.toFixed(2) + '</div>\n              </div>\n            ';
            }).join('');
          }
        }

        var labels = last7.map(function(d) { return d.slice(5).replace('-', '/'); });
        var chartDefaults = {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: 'rgba(17,17,24,0.95)',
              borderColor: 'rgba(139,92,246,0.3)',
              borderWidth: 1,
              padding: 10,
              titleFont: { family: 'DM Mono', size: 11 },
              bodyFont: { family: 'DM Sans', size: 13 }
            }
          },
          scales: {
            x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#6b6b80', font: { family: 'DM Mono', size: 11 } } },
            y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#6b6b80', font: { family: 'DM Mono', size: 11 } }, beginAtZero: true }
          }
        };

        if (userChart) { try { userChart.destroy(); } catch(e) {} userChart = null; }
        if (premiumChart) { try { premiumChart.destroy(); } catch(e) {} premiumChart = null; }

        var usersCtx = document.getElementById('usersChart');
        if (usersCtx) {
          userChart = new Chart(usersCtx, {
            type: 'bar',
            data: { labels: labels, datasets: [{ label: 'Kullanıcı', data: uCounts, backgroundColor: 'rgba(34,197,94,0.2)', borderColor: '#34d399', borderWidth: 2, borderRadius: 6 }] },
            options: chartDefaults
          });
        }

        var premiumCtx = document.getElementById('premiumChart');
        if (premiumCtx) {
          premiumChart = new Chart(premiumCtx, {
            type: 'bar',
            data: { labels: labels, datasets: [{ label: 'Premium Gelir ($)', data: revenueData, backgroundColor: 'rgba(139,92,246,0.25)', borderColor: '#7c6dfa', borderWidth: 2, borderRadius: 6 }] },
            options: {
              plugins: {
                legend: { display: true, labels: { color: '#6b6b80', font: { family: 'DM Mono', size: 10 } } },
                tooltip: chartDefaults.plugins.tooltip
              },
              scales: {
                x: chartDefaults.scales.x,
                y: { grid: chartDefaults.scales.y.grid, ticks: { color: '#6b6b80', font: { family: 'DM Mono', size: 11 }, callback: function(value) { return '$' + value; } }, beginAtZero: true }
              },
              responsive: true,
              maintainAspectRatio: false
            }
          });
        }
      } catch (e) {
        // Sessizce geç
      }
    }

    var currentImageFile = null;

          return; 
        }

          showToast('Resim 2MB\'dan küçük olmalı!', 'error'); 
          return; 
        }
        var r = new FileReader();
        r.onload = function(ev) {
          var preview = document.getElementById('ref-image-preview-img');
          if (preview) preview.src = ev.target.result;
        };
        r.readAsDataURL(f);
        currentImageFile = f;
      });

      removeImageBtn.addEventListener('click', function() {
        var preview = document.getElementById('ref-image-preview-img');

        var refImage = document.getElementById('ref-image');
        if (refImage) refImage.value = '';
        currentImageFile = null;
      });

    async function uploadImage(file) {
      if (!file) return null;
      try {
        var ext = file.name.split('.').pop();
        var path = 'references/' + Date.now() + '_' + Math.random().toString(36).slice(7) + '.' + ext;
        var { error } = await sb.storage.from('references-images').upload(path, file);
        if (error) return null;
        var publicUrl = sb.storage.from('references-images').getPublicUrl(path).data.publicUrl;
        return publicUrl;
      } catch(e) {
        return null;
      }
    }

    function openReferenceModal(ref) {
      ref = ref || null;
      var m = document.getElementById('ref-modal');
      if (!m) return;
      
      var idEl = document.getElementById('ref-id');
      var nameEl = document.getElementById('ref-name');
      var titleEl = document.getElementById('ref-title');
      var descEl = document.getElementById('ref-desc');
      var orderEl = document.getElementById('ref-order');
      var activeEl = document.getElementById('ref-active');
      var instaEl = document.getElementById('ref-insta');
      var twitterEl = document.getElementById('ref-twitter');
      var youtubeEl = document.getElementById('ref-youtube');
      var linkedinEl = document.getElementById('ref-linkedin');
      var previewEl = document.getElementById('ref-image-preview-img');
      var imageEl = document.getElementById('ref-image');
      var titleModalEl = document.getElementById('ref-modal-title');
      
      if (idEl) idEl.value = ref && ref.id ? ref.id : '';
      if (nameEl) nameEl.value = ref && ref.name ? ref.name : '';
      if (titleEl) titleEl.value = ref && ref.title ? ref.title : '';
      if (descEl) descEl.value = ref && ref.description ? ref.description : '';

      if (activeEl) activeEl.value = ref && ref.is_active !== undefined ? ref.is_active : true;
      if (instaEl) instaEl.value = ref && ref.instagram ? ref.instagram : '';
      if (twitterEl) twitterEl.value = ref && ref.twitter ? ref.twitter : '';
      if (youtubeEl) youtubeEl.value = ref && ref.youtube ? ref.youtube : '';
      if (linkedinEl) linkedinEl.value = ref && ref.linkedin ? ref.linkedin : '';
      if (previewEl) previewEl.src = ref && ref.image_url ? ref.image_url : 'https://placehold.co/64x64?text=Photo';
      if (imageEl) imageEl.value = ref && ref.image_url ? ref.image_url : '';
      if (titleModalEl) titleModalEl.textContent = ref ? 'Referans Düzenle' : 'Yeni Referans Ekle';
      m.classList.add('open');
      currentImageFile = null;
    }

    async function saveReference() {
      var idEl = document.getElementById('ref-id');
      var id = idEl ? idEl.value : '';
      var imageEl = document.getElementById('ref-image');
      var imageUrl = imageEl ? imageEl.value : '';
      
      if (currentImageFile) {
        var url = await uploadImage(currentImageFile);
        if (url) imageUrl = url;
      }
      
      var nameEl = document.getElementById('ref-name');
      var titleEl = document.getElementById('ref-title');
      var descEl = document.getElementById('ref-desc');
      var orderEl = document.getElementById('ref-order');
      var activeEl = document.getElementById('ref-active');
      var instaEl = document.getElementById('ref-insta');
      var twitterEl = document.getElementById('ref-twitter');
      var youtubeEl = document.getElementById('ref-youtube');
      var linkedinEl = document.getElementById('ref-linkedin');
      
      var payload = {
        name: nameEl ? nameEl.value.trim() : '',
        title: titleEl ? titleEl.value.trim() : '',
        description: descEl ? descEl.value.trim() : '',
        image_url: imageUrl,
        display_order: parseInt(orderEl ? orderEl.value : 0) || 0,
        is_active: activeEl ? activeEl.value === 'true' : true,
        instagram: instaEl ? instaEl.value.trim() : '',
        twitter: twitterEl ? twitterEl.value.trim() : '',
        youtube: youtubeEl ? youtubeEl.value.trim() : '',
        linkedin: linkedinEl ? linkedinEl.value.trim() : ''
      };
      
      if (!payload.name) { 
        showToast('İsim alanı zorunludur!', 'error'); 
        return; 
      }

      var result;
      if (id) {
        result = await sb.from('references').update(payload).eq('id', id);
      } else {
        result = await sb.from('references').insert([payload]);
      }

      if (result && result.error) { 
        showToast('Kayıt hatası: ' + result.error.message, 'error'); 
        return; 
      }
      
      showToast(id ? 'Referans güncellendi!' : 'Referans eklendi!');
      closeReferenceModal();
      await loadReferences();
      renderReferencesTable();
    }

    var cancelRefBtn = document.getElementById('cancel-ref-btn');
    if (cancelRefBtn) cancelRefBtn.addEventListener('click', closeReferenceModal);
    
    var saveRefBtn = document.getElementById('save-ref-btn');
    if (saveRefBtn) saveRefBtn.addEventListener('click', saveReference);
    
    var closeRefModal = document.getElementById('close-ref-modal');
    if (closeRefModal) closeRefModal.addEventListener('click', closeReferenceModal);
    
    var refModal = document.getElementById('ref-modal');
    if (refModal) {
      refModal.addEventListener('click', function(e) { 
        if (e.target.id === 'ref-modal') closeReferenceModal(); 
      });
    }

    // Global functions
    window.switchPanel = switchPanel;
    window.addPaymentMethod = addPaymentMethod;
    window.removePaymentMethod = removePaymentMethod;
    window.editReference = editReference;
    window.deleteReference = deleteReference;
    window.openReferenceModal = openReferenceModal;
    window.renderUsersTable = renderUsersTable;
    window.loadUsers = loadUsers;
    window.renderPricesContent = renderPricesContent;
    window.loadAnalyticsData = loadAnalyticsData;
    window.renderReferencesTable = renderReferencesTable;

    // ⭐ INIT - Admin paneli yükle
    (async function() {
      try {
        var user = await requireAdmin();
        if (!user) return;

        await loadReferences();
        await loadUsers();
        renderAdminPanel();
      } catch (e) {
        // Sessizce geç
      }
    })();
  </script>
</body>
</html>
